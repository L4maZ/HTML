<script>
const P=(l,t)=>({l,t});

/* ============ ĐỊNH NGHĨA ĐIỀU 4 (31 khoản, nguyên văn) ============ */
const DEF=[
{n:'1',t:'Rủi ro thị trường (RRTT)',paras:[
P(0,'1. Rủi ro thị trường (RRTT): Là rủi ro do biến động bất lợi của lãi suất, tỷ giá, giá vàng, giá chứng khoán và giá hàng hóa trên thị trường. Rủi ro thị trường bao gồm:'),
P(1,'a) Rủi ro lãi suất: Là rủi ro do biến động bất lợi của lãi suất trên thị trường đối với giá trị của giấy tờ có giá, công cụ tài chính có lãi suất, sản phẩm phái sinh lãi suất trên sổ kinh doanh của MSB;'),
P(1,'b) Rủi ro ngoại hối: Là rủi ro do biến động bất lợi của tỷ giá, giá vàng trên thị trường khi MSB có trạng thái ngoại tệ, trạng thái vàng;'),
P(1,'c) Rủi ro giá cổ phiếu: Là rủi ro do biến động bất lợi của giá cổ phiếu trên thị trường đối với giá trị của cổ phiếu, giá trị chứng khoán phái sinh trên sổ kinh doanh (nếu có) của MSB;'),
P(1,'d) Rủi ro giá hàng hóa: Là rủi ro do biến động bất lợi của giá hàng hóa trên thị trường đối với giá trị của sản phẩm phái sinh hàng hóa, giá trị của sản phẩm trong giao dịch giao ngay chịu rủi ro giá hàng hóa của MSB.')],
arrow:'biến động bất lợi 5 loại giá (lãi suất / tỷ giá / vàng / cổ phiếu / hàng hóa), chia <b>4 cấu phần</b>: lãi suất · ngoại hối (gồm vàng) · giá cổ phiếu · giá hàng hóa.'},

{n:'2',t:'Rủi ro tập trung',paras:[
P(0,'2. Rủi ro tập trung đối với hoạt động giao dịch tự doanh theo sản phẩm (sau đây gọi là rủi ro tập trung): Là rủi ro do MSB có hoạt động kinh doanh tập trung vào một sản phẩm ở mức độ có tác động đáng kể theo quy định nội bộ MSB đến thu nhập, trạng thái rủi ro của MSB.')],
arrow:'dồn quá nhiều vào một sản phẩm tự doanh tới mức tác động đáng kể đến thu nhập / trạng thái rủi ro; ngưỡng "đáng kể" theo quy định nội bộ.'},

{n:'3',t:'Rủi ro lãi suất chung (GIRR)',paras:[
P(0,'3. Rủi ro lãi suất chung (general interest rate risk - GIRR): là rủi ro phát sinh do biến động của các yếu tố lãi suất chung/lãi suất phi rủi ro/lãi suất tham chiếu trên thị trường, bao gồm mức lãi suất, đường cong lãi suất, chênh lệch giữa các đường cong lãi suất và độ biến động lãi suất, làm thay đổi bất lợi giá trị công cụ, giao dịch hoặc danh mục của MSB.')],
arrow:'rủi ro từ lãi suất "phi rủi ro / tham chiếu" chung của thị trường, gồm <b>4 chiều</b>: mức · đường cong · chênh lệch đường cong · độ biến động.'},

{n:'4',t:'Rủi ro chênh lệch tín dụng (CSR)',paras:[
P(0,'4. Rủi ro chênh lệch tín dụng (credit spread risk - CSR): là rủi ro phát sinh từ biến động bất lợi của chênh lệch tín dụng (credit spread) do tác động của thay đổi xếp hạng tín nhiệm, chất lượng tín dụng hoặc kỳ vọng thị trường về rủi ro tín dụng của tổ chức phát hành hoặc đối tác, biến động này làm thay đổi giá trị thị trường của công cụ tài chính thuộc phạm vi quản lý rủi ro thị trường.')],
arrow:'rủi ro khi phần bù tín dụng (spread) của tổ chức phát hành / đối tác giãn ra do hạ xếp hạng / xấu chất lượng tín dụng / kỳ vọng thị trường, làm rớt giá công cụ.'},

{n:'5',t:'Rủi ro cơ sở (basis risk)',paras:[
P(0,'5. Rủi ro cơ sở (basis risk): là rủi ro phát sinh từ sự biến động không đồng nhất hoặc không tương quan hoàn hảo giữa các yếu tố thị trường có liên quan, bao gồm nhưng không giới hạn các chỉ số tham chiếu, đường cong, kỳ hạn, đồng tiền, công cụ, thị trường hoặc giữa đối tượng được phòng ngừa và công cụ phòng ngừa, dẫn đến biến động bất lợi đối với giá trị công cụ, giao dịch, danh mục hoặc hiệu quả phòng ngừa rủi ro (ví dụ chênh lệch biến động giữa lãi suất VNIBOR và lãi suất trái phiếu Chính phủ, giữa hai kỳ hạn trên cùng đường cong lãi suất, giữa trái phiếu và hợp đồng phòng ngừa liên quan, hoặc giữa giao dịch gốc và giao dịch hedge không cùng chỉ số/kỳ hạn/đồng tiền).')],

"fill:#e8551a"/><text x="193" y="44" style="fill:#9a4020;font:500 12px sans-serif">Lãi suất TPCP</text><text x="302.0" y="276" text-anchor="middle" style="fill:#9a4020;font:600 13px sans-serif">Thời gian →</text></svg>',
chartCap:'Hai lãi suất lẽ ra biến động cùng chiều, nhưng chênh lệch (spread) giữa chúng giãn dần — đó là <b>basis risk</b>.',
ex:'MSB dùng hợp đồng gắn <b>VNIBOR</b> để phòng ngừa một danh mục <b>TPCP</b>. Khi spread VNIBOR–TPCP giãn từ 0,5% lên 1,4%, vị thế phòng ngừa không còn khớp → phát sinh lỗ dù cả hai lãi suất đều cùng xu hướng tăng.',
arrow:'hai thứ đáng lẽ chạy cùng nhau lại lệch nhau (khác chỉ số / kỳ hạn / đồng tiền / công cụ), khiến hedge không khớp hoặc danh mục lỗ.'},

{n:'6',t:'Rủi ro đường cong (curve risk)',paras:[
P(0,'6. Rủi ro đường cong (curve risk): là rủi ro phát sinh từ sự thay đổi hình dạng, độ dốc hoặc cấu trúc kỳ hạn của các đường cong thị trường liên quan, bao gồm đường cong lãi suất, đường cong chênh lệch tín dụng hoặc các đường cong định giá/yếu tố rủi ro khác, dẫn đến biến động bất lợi đối với giá trị công cụ, giao dịch hoặc danh mục.')],
chart:'<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg"><line x1="64" y1="214.0" x2="540" y2="214.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="218.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">3.5%</text><line x1="64" y1="180.0" x2="540" y2="180.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="184.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">4.0%</text><line x1="64" y1="146.0" x2="540" y2="146.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="150.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">4.5%</text><line x1="64" y1="112.0" x2="540" y2="112.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="116.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">5.0%</text><line x1="64" y1="78.0" x2="540" y2="78.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="82.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">5.5%</text><line x1="64" y1="44" x2="64" y2="248" style="stroke:#c9a99c;stroke-width:1.5;fill:none"/><line x1="64" y1="248" x2="540" y2="248" style="stroke:#c9a99c;stroke-width:1.5;fill:none"/><path d="M64.0,234.4 L143.3,200.4 L222.7,173.2 L302.0,152.8 L381.3,118.8 L460.7,91.6 L540.0,64.4" style="fill:none;stroke:#276749;stroke-width:2.6"/><path d="M64.0,234.4 L143.3,210.6 L222.7,193.6 L302.0,183.4 L381.3,169.8 L460.7,163.0 L540.0,159.6" style="fill:none;stroke:#b83a10;stroke-width:2.9"/><circle cx="64.0" cy="234.4" r="4" style="fill:#276749"/><text x="70.0" y="250.4" style="fill:#9a4020;font:500 12px sans-serif">điểm xoay</text><line x1="540.0" y1="64.4" x2="540.0" y2="159.6" style="stroke:#9a2f0e;stroke-width:1.4;stroke-dasharray:3 3"/><text x="534.0" y="112.0" text-anchor="end" style="fill:#9a2f0e;font:700 12px sans-serif">đầu dài</text><text x="534.0" y="126.0" text-anchor="end" style="fill:#9a2f0e;font:700 12px sans-serif">tụt xuống</text><text x="64.0" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">3M</text><text x="143.3" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">1Y</text><text x="222.7" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">2Y</text><text x="302.0" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">3Y</text><text x="381.3" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">5Y</text><text x="460.7" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">7Y</text><text x="540.0" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">10Y</text><line x1="64" y1="14" x2="84" y2="14" style="fill:none;stroke:#276749;stroke-width:2.6"/><text x="89" y="18" style="fill:#9a4020;font:500 12px sans-serif">Đường cong gốc (dốc lên)</text><line x1="294" y1="14" x2="314" y2="14" style="fill:none;stroke:#b83a10;stroke-width:2.9"/><text x="319" y="18" style="fill:#9a4020;font:500 12px sans-serif">Bẹt đi (flattening)</text><text x="302.0" y="280" text-anchor="middle" style="fill:#9a4020;font:600 13px sans-serif">Kỳ hạn →</text></svg>',
chartCap:'Đường cong đang <b>dốc lên</b> bị <b>bẹt đi</b> (flattening): đầu ngắn giữ nguyên, đầu dài tụt xuống — mức trung bình gần như không đổi nhưng <b>hình dạng</b> đổi. Đó là curve risk.',
ex:'Danh mục TPCP của MSB tập trung kỳ hạn dài (7Y–10Y). Khi đường cong <b>bẹt đi</b> — đầu ngắn giữ nguyên nhưng đầu dài tụt ~1% — chênh lệch lợi suất dài/ngắn thu hẹp, ảnh hưởng trực tiếp giá trị danh mục kỳ hạn dài dù mức lãi suất trung bình gần như không đổi.',
arrow:'rủi ro khi bản thân <b>hình dạng đường cong</b> đổi (dốc lên / bẹt / xoắn), không phải toàn bộ lãi suất dịch song song.'},

{n:'7',t:'Rủi ro delta',paras:[
P(0,'7. Rủi ro delta: là rủi ro phát sinh do giá trị công cụ, giao dịch hoặc danh mục thay đổi khi yếu tố rủi ro thị trường cơ sở thay đổi, phản ánh tác động tuyến tính/bậc một của yếu tố rủi ro.')],
ex:'MSB giữ trạng thái <b>long 1 triệu USD</b>. Tỷ giá USD/VND tăng 100đ → lãi ~100 triệu VND; giảm 100đ → lỗ tương ứng. Delta ở đây ≈ 1 triệu USD.',
arrow:'độ nhạy bậc một — yếu tố cơ sở nhích 1 đơn vị thì giá trị đổi tuyến tính bấy nhiêu.'},

{n:'8',t:'Rủi ro vega',paras:[
P(0,'8. Rủi ro vega: là rủi ro phát sinh do giá trị công cụ, giao dịch hoặc danh mục thay đổi khi độ biến động hàm ý (Implied volatility) của yếu tố rủi ro thị trường thay đổi.')],
note:{tag:'Lưu ý thuật ngữ',html:'<b>Độ biến động hàm ý</b> = mức dao động thị trường đang <b>ngầm định</b>, suy ngược từ giá quyền chọn đang giao dịch (nhìn về tương lai) — khác với biến động lịch sử tính từ giá quá khứ. Giá cơ sở đứng yên nhưng thị trường kỳ vọng sắp dao động mạnh hơn → implied vol tăng → quyền chọn đắt lên → phát sinh lỗ/lãi vega, độc lập với delta.'},
ex:'MSB <b>bán</b> một quyền chọn USD/VND. Thị trường căng thẳng, implied vol nhảy từ <b>3% lên 6%</b> dù tỷ giá giao ngay không đổi → quyền chọn được định giá lại cao hơn → MSB (đang short vega) ghi nhận lỗ.',
arrow:'độ nhạy với <b>kỳ vọng biến động</b> của thị trường (chủ yếu ở quyền chọn), không phải với bản thân giá cơ sở.'},

{n:'9',t:'Rủi ro curvature',paras:[
P(0,'9. Rủi ro curvature: là rủi ro phát sinh do giá trị công cụ thay đổi phi tuyến khi yếu tố rủi ro thị trường cơ sở biến động (tức phần rủi ro không được phản ánh đầy đủ bởi delta).')],
ex:'Với một quyền chọn, khi USD/VND biến động nhỏ, Delta ước tính khá đúng. Nhưng khi tỷ giá biến động mạnh, lãi/lỗ thực tế lớn hơn ước tính tuyến tính — phần chênh là curvature (tương ứng gamma).',
arrow:'độ cong bậc hai — phần delta bỏ sót khi biến động lớn (tương ứng gamma trong bộ Greeks).'},

{n:'10',t:'Yếu tố rủi ro thị trường',paras:[
P(0,'10. Yếu tố rủi ro thị trường là các biến số thị trường có thể ảnh hưởng đến giá trị công cụ, giao dịch hoặc danh mục, bao gồm nhưng không giới hạn lãi suất, đường cong lãi suất, tỷ giá, giá vàng, giá chứng khoán, giá hàng hóa, chênh lệch tín dụng, chênh lệch cơ sở, độ biến động, tương quan và các yếu tố thị trường khác phù hợp với sản phẩm, danh mục và phương pháp đo lường được áp dụng.')]},

{n:'11',t:'Sổ kinh doanh',paras:[
P(0,'11. Sổ kinh doanh là danh mục ghi nhận các trạng thái của:'),
P(1,'a) Giao dịch tự doanh;'),
P(1,'b) Giao dịch để thực hiện nghiệp vụ bảo lãnh phát hành công cụ tài chính;'),
P(1,'c) Giao dịch sản phẩm phái sinh để phòng ngừa rủi ro của các giao dịch tự doanh của MSB;'),
P(1,'d) Giao dịch mua bán ngoại tệ, vàng, tài sản tài chính để phục vụ nhu cầu của khách hàng, đối tác và các giao dịch để đối ứng với các giao dịch này.')],
arrow:'nơi ghi <b>4 nhóm trạng thái</b>: tự doanh · bảo lãnh phát hành · hedge cho tự doanh · phục vụ khách hàng + đối ứng. (Tiêu chí phân loại chi tiết ở Điều 9.)'},

{n:'12',t:'Giao dịch tự doanh',paras:[
P(0,'12. Giao dịch tự doanh: Là giao dịch mua, bán, trao đổi do MSB, công ty con của MSB thực hiện theo quy định của Pháp luật với mục đích mua, bán, trao đổi trong thời hạn không quá 01 năm để thu lợi từ chênh lệch giá trị thị trường cho MSB đối với các công cụ tài chính, bao gồm:'),
P(1,'a) Các công cụ tài chính trên thị trường tiền tệ;'),
P(1,'b) Các loại tiền tệ (bao gồm cả vàng);'),
P(1,'c) Chứng khoán trên thị trường vốn;'),
P(1,'d) Các sản phẩm phái sinh;'),
P(1,'e) Các công cụ tài chính khác được giao dịch trên thị trường chính thức.')],
arrow:'mua bán ngắn hạn (≤1 năm) ăn chênh giá thị trường, trên <b>5 nhóm công cụ</b>.'},

{n:'13',t:'Công cụ tài chính',paras:[
P(0,'13. Công cụ tài chính: Là hợp đồng làm tăng tài sản tài chính của một bên và nợ phải trả tài chính hoặc công cụ vốn chủ sở hữu của bên khác. Trong đó, công cụ vốn chủ sở hữu là hợp đồng chứng minh được những lợi ích còn lại về tài sản của đơn vị sau khi trừ đi toàn bộ nghĩa vụ của đơn vị đó.')],
arrow:'hợp đồng tạo tài sản tài chính bên này ↔ nợ tài chính / vốn chủ bên kia (theo chuẩn mực kế toán).'},

{n:'14',t:'Trạng thái rủi ro',paras:[
P(0,'14. Trạng thái rủi ro: Là mức độ rủi ro thị trường của MSB tại một thời điểm thể hiện thông qua giá trị rủi ro thị trường sau khi đã được quy đổi theo rủi ro của tài sản có rủi ro, nợ phải trả có rủi ro, khoản mục ngoại bảng có rủi ro thị trường.')],
arrow:'mức RRTT tại một thời điểm, đo bằng giá trị đã quy đổi theo rủi ro (gồm cả nội & ngoại bảng).'},

{n:'15',t:'VaR (Value at Risk)',paras:[

{n:'19',t:'Ma trận rủi ro toàn diện',paras:[

arrow:'công cụ dự báo, đo sức chịu đựng trước kịch bản bất lợi.'},

{n:'21',t:'Đơn vị tự doanh (Trading Desks)',paras:[

{n:'30',t:'Phòng QTDL&MHRR',paras:[

{id:'d10',tab:'Điều 10',sub:'Nhận dạng rủi ro thị trường',chap:'Chương III. QUY TRÌNH QUẢN LÝ RỦI RO THỊ TRƯỜNG',
 chapNote:'Quy trình quản lý rủi ro thị trường bao gồm: Nhận dạng rủi ro – Đo lường và đánh giá rủi ro – Kiểm soát và giảm thiểu rủi ro – Giám sát và Báo cáo. MSB thực hiện nhận dạng, đo lường, theo dõi và kiểm soát RRTT đáp ứng tối thiểu các yêu cầu sau đây:',
 eyebrow:'Điều 10',title:'Nhận dạng rủi ro thị trường',gapCount:0,
 kh:[
 {n:'1',t:'Nội dung nhận dạng RRTT',paras:[
  P(0,'1. Nội dung nhận dạng RRTT'),
  P(0,'MSB thực hiện nhận diện rủi ro thị trường phát sinh đối với sản phẩm, giao dịch, danh mục, trading desk, hoạt động nghiệp vụ hoặc khoản mục có liên quan theo các nhóm rủi ro và yếu tố rủi ro phù hợp với quy định pháp luật, chuẩn mực quản trị rủi ro và nhu cầu quản trị của MSB trong từng thời kỳ.'),
  P(0,'Nội dung nhận dạng bao gồm tối thiểu:'),
  P(1,'a) Xác định sản phẩm, giao dịch, danh mục hoặc khoản mục thuộc Sổ kinh doanh theo quy định nội bộ của MSB;'),
  P(1,'b) Phân loại rủi ro thị trường'),
  P(2,'i) Theo bản chất rủi ro chính (risk class):'),
  P(3,'- Rủi ro lãi suất;'),
  P(3,'- Rủi ro ngoại hối;'),
  P(3,'- Rủi ro giá cổ phiếu;'),
  P(3,'- Rủi ro giá hàng hóa;'),
  P(2,'ii) Theo đặc tính đo lường rủi ro dựa trên độ nhạy, phù hợp với phương pháp đo lường dựa trên độ nhạy (Sensitivities-based Method - SBM) theo chuẩn mực Basel, áp dụng đối với từng nhóm rủi ro thị trường (risk class) phù hợp:'),
  P(3,'- Rủi ro delta:'),
  P(4,'+ Rủi ro phát sinh do giá trị công cụ, giao dịch hoặc danh mục thay đổi khi yếu tố rủi ro thị trường cơ sở thay đổi, phản ánh tác động tuyến tính/bậc một của yếu tố rủi ro;'),
  P(4,'+ Phát sinh ở hầu hết sản phẩm tài chính: spot, forward, swap, trái phiếu, cổ phiếu, hàng hóa, phái sinh và quyền chọn;'),
  P(4,'+ Ví dụ: Tỷ giá USD/VND tăng làm thay đổi giá trị trạng thái ngoại tệ; lãi suất tăng làm giảm giá trái phiếu.'),
  P(3,'- Rủi ro vega:'),
  P(4,'+ Rủi ro phát sinh do giá trị công cụ thay đổi khi độ biến động hàm ý (Implied volatility) của yếu tố rủi ro thị trường thay đổi;'),
  P(4,'+ Chủ yếu phát sinh từ quyền chọn hoặc công cụ có đặc tính quyền chọn: FX option, interest rate option, bond option, structured product, callable/putable instruments;'),
  P(4,'+ Ví dụ: Implied volatility của USD/VND tăng làm giá trị FX option thay đổi dù tỷ giá giao ngay chưa thay đổi.'),
  P(3,'- Rủi ro curvature:'),
  P(4,'+ Rủi ro phát sinh do giá trị công cụ thay đổi phi tuyến khi yếu tố rủi ro thị trường cơ sở biến động (tức phần rủi ro không được phản ánh đầy đủ bởi delta);'),
  P(4,'+ Chủ yếu phát sinh ở sản phẩm quyền chọn/có đặc tính quyền chọn hoặc công cụ có độ lồi/quan hệ giá trị phi tuyến trọng yếu: options, callable/putable bonds, structured notes, mortgage-related products, trái phiếu kỳ hạn dài;'),
  P(4,'+ Ví dụ: Khi tỷ giá USD/VND tăng mạnh, giá quyền chọn thay đổi nhiều hơn mức ước tính tuyến tính theo delta; trái phiếu dài hạn có thể thay đổi giá phi tuyến khi lãi suất biến động lớn.'),
  P(2,'iii) Tùy mục tiêu đo lường, giám sát, kiểm soát rủi ro trong từng thời kỳ, MSB có thể nhận dạng và phân loại RRTT bổ sung các loại rủi ro thành phần sau:'),
  P(3,'- Rủi ro lãi suất chung (general interest rate risk – GIRR);'),
  P(3,'- Rủi ro chênh lệch tín dụng (credit spread risk – CSR);'),
  P(3,'- Rủi ro đường cong lãi suất (curve risk);'),
  P(3,'- Rủi ro cơ sở (basis risk);'),
  P(2,'iv) Các phân loại rủi ro thị trường khác theo quy định của pháp luật và nhu cầu quản trị của MSB từng thời kỳ;'),
  P(1,'c) Nhận dạng rủi ro tập trung đối với hoạt động giao dịch tự doanh, áp dụng với các khoản mục được hạch toán là khoản mục nội bảng, khoản mục ngoại bảng của MSB và các khoản mục chưa được hạch toán theo quy định của pháp luật về kế toán.'),
  P(1,'d) Yếu tố rủi ro thị trường tác động đến sản phẩm, giao dịch hoặc danh mục, bao gồm nhưng không giới hạn: đường cong lãi suất, tỷ giá, giá vàng, giá chứng khoán, giá hàng hóa, chênh lệch tín dụng (credit spread), chênh lệch cơ sở (basis), độ biến động (volatility), tương quan (correlation) và các yếu tố rủi ro khác khi phù hợp;'),
  P(1,'e) Xác định hệ thống ghi nhận giao dịch, hệ thống dữ liệu lưu trữ và nguồn thông tin phục vụ quản lý, đo lường, giám sát và báo cáo RRTT;'),
  P(1,'f) Đánh giá khả năng định giá, nguồn giá, dữ liệu thị trường, mô hình định giá, mức độ thanh khoản thị trường và các yếu tố có thể làm gia tăng sai lệch giá trị ghi nhận hoặc lãi/lỗ đánh giá lại;'),
  P(1,'g) Đánh giá khả năng có thể phòng ngừa rủi ro cho các rủi ro thị trường được nhận dạng.')],
 defs:[['11','Sổ kinh doanh'],['1','RRTT'],['7','Rủi ro delta'],['8','Rủi ro vega'],['9','Rủi ro curvature'],['3','GIRR'],['4','CSR'],['6','Curve risk'],['5','Basis risk'],['2','Rủi ro tập trung'],['10','Yếu tố RRTT'],['21','Trading Desks']],
 arrow:'nội dung nhận dạng tối thiểu: xác định khoản mục Sổ KD (a) · phân loại rủi ro theo <b>risk class</b> và theo <b>độ nhạy delta/vega/curvature (SBM Basel)</b>, bổ sung GIRR/CSR/curve/basis khi cần (b) · nhận dạng rủi ro tập trung tự doanh gồm cả khoản mục chưa hạch toán (c) · yếu tố RRTT (d) · hệ thống & nguồn dữ liệu (e) · khả năng định giá và nguồn giá (f) · khả năng phòng ngừa (g).',
 gap:{status:'N',reason:'Nội dung nhận dạng đã bám theo chuẩn Basel (risk class + SBM delta/vega/curvature + nhóm rủi ro thành phần). Không phát sinh nghĩa vụ chưa được đáp ứng. Năng lực đo lường thực tế thuộc phạm vi Điều 11.'}},

 {n:'2',t:'Phương thức thực hiện nhận dạng RRTT',paras:[
  P(0,'2. Phương thức thực hiện nhận dạng RRTT'),
  P(0,'MSB thực hiện nhận dạng RRTT thông qua việc kết hợp các phương thức, kênh thông tin và hoạt động quản lý rủi ro phù hợp nhằm phát hiện kịp thời các nguồn rủi ro hiện hữu, rủi ro tiềm ẩn và rủi ro mới phát sinh. Việc nhận dạng RRTT được thực hiện đồng thời với việc xác định các chỉ tiêu, phương pháp đo lường và cơ chế giám sát phù hợp.'),
  P(1,'a) Nhận dạng thông qua rà soát sản phẩm, giao dịch, danh mục, trading desk, nghiệp vụ kinh doanh trọng yếu và các hoạt động có phát sinh yếu tố RRTT theo phạm vi quản lý RRTT của MSB và Bảng ma trận rủi ro toàn diện tại Phụ lục số PL01/QC.RR.008.'),
  P(1,'b) Nhận dạng trong quá trình xây dựng kế hoạch kinh doanh, thiết lập khẩu vị rủi ro, hạn mức rủi ro, chiến lược danh mục, kế hoạch giao dịch, kế hoạch phòng ngừa rủi ro hoặc các định hướng kinh doanh có khả năng làm phát sinh hoặc thay đổi đáng kể trạng thái RRTT;'),
  P(1,'c) Nhận dạng trong quá trình phê duyệt, triển khai hoặc thay đổi trọng yếu đối với sản phẩm mới, nghiệp vụ mới, thị trường mới, mô hình định giá, nguồn dữ liệu, hệ thống ghi nhận giao dịch, quy trình vận hành hoặc cơ chế kiểm soát liên quan đến RRTT.'),
  P(1,'d) Nhận dạng trong quá trình theo dõi và kiểm soát rủi ro được thực hiện theo Điều 14 Quy chế này, bao gồm:'),
  P(2,'i) Theo dõi diễn biến thị trường và các sự kiện bất thường có khả năng làm phát sinh, gia tăng hoặc lan truyền rủi ro thị trường;'),
  P(2,'ii) Cập nhật các sự kiện vĩ mô, chính sách và thị trường có thể gây biến động trọng yếu;'),
  P(2,'iii) Giám sát hệ thống chỉ số cảnh báo sớm.'),
  P(1,'e) Nhận dạng rủi ro thông qua kiểm tra sức chịu đựng; phân tích rủi ro trong các kịch bản giả định và điều kiện thị trường bất lợi nhằm nhận diện rủi ro tiềm ẩn tác động đến khả năng chịu đựng về vốn và thu nhập; mức độ thanh khoản (khối lượng và thời gian thoát vị thế) của tài sản tài chính tương ứng với các kịch bản thanh khoản thị trường;'),
  P(1,'f) Nhận dạng thông qua rà soát kết quả đo lường (backtesting), giám sát/kiểm tra giá độc lập (IPV), đánh giá mô hình (validation), sự kiện vi phạm hạn mức, tổn thất thực tế hoặc các ngoại lệ phát sinh trong quá trình quản lý RRTT.'),
  P(1,'g) Nhận dạng thông qua thông tin, báo cáo, cảnh báo hoặc khuyến nghị từ các đơn vị kinh doanh, đơn vị vận hành, đơn vị quản lý rủi ro khác có liên quan, tài chính, kế toán, kiểm toán nội bộ và các đơn vị liên quan khác trong quá trình thực hiện chức năng, nhiệm vụ được giao.'),
  P(1,'h) Nhận dạng thông qua đánh giá mức độ tương tác chéo với các loại rủi ro trọng yếu khác theo Khung QLRR của MSB từng thời kỳ nhằm nhận diện đầy đủ cơ chế phát sinh, lan truyền và khuếch đại rủi ro đối với trạng thái rủi ro, thu nhập, vốn và khả năng tuân thủ hạn mức, bao gồm:'),

/* ================= RENDER ================= */
function paraHTML(p){return `<div class="p${p.l}">${p.t}</div>`;}

function defbarHTML(defs){
  if(!defs||!defs.length) return '';
  return `<div class="defbar"><span class="lb">Định nghĩa liên quan</span>`+
    defs.map(d=>`<button class="defchip" onclick="goDef('${d[0]}')">Đ4 K${d[0]} · ${d[1]} ↗</button>`).join('')+`</div>`;
}
function gapHTML(g){
  if(!g) return '';
  if(g.status==='N'){
    return `<div class="nbox nb-n"><span class="tag">Đánh giá GAP — N</span></div>`;
  }
  const t=(lbl,v)=>`<div class="tcard${v?'':' empty'}"><h5>${lbl}</h5><p>${v||'—'}</p></div>`;
  const has=(x)=>x?x:'';
  let s=`<div class="gapbox"><div class="gapbox-hd"><span class="yn">GAP = Y</span> ${g.ref||'GAP'}</div><div class="gapbox-bd">`;
  s+=`<div class="grow"><div class="glbl">Trách nhiệm thực hiện / phối hợp</div><div class="tuyen">
      ${t('Tuyến 1',g.t1)}${t('Tuyến 2',g.t2)}${t('Tuyến 3',g.t3)}</div></div>`;
  const gaps=[['Tuyến 1',g.gapT1],['Tuyến 2',g.gapT2],['Tuyến 3',g.gapT3]].filter(x=>x[1]);
  s+=`<div class="grow"><div class="glbl">GAP / Hiện trạng</div>`+
     gaps.map(x=>`<div class="gtxt" style="margin-bottom:7px"><b style="color:#9B2C2C">${x[0]}:</b> ${x[1]}</div>`).join('')+`</div>`;
  const nas=[['Tuyến 1',g.naT1],['Tuyến 2',g.naT2],['Tuyến 3',g.naT3]].filter(x=>x[1]);
  s+=`<div class="grow"><div class="glbl">Next action</div>`+
     nas.map(x=>`<div class="gtxt" style="margin-bottom:7px"><b style="color:#9B2C2C">${x[0]}:</b> ${x[1]}</div>`).join('')+`</div>`;
  s+=`<div class="grow"><div class="glbl">Phân loại Action (MLIR)</div><div class="clschips">
      <span class="cchip${g.cls&&g.cls.vb?' on':''}">Cần bổ sung quy định</span>
      <span class="cchip${g.cls&&g.cls.bc?' on':''}">Cần bổ sung báo cáo</span>
      <span class="cchip${g.cls&&g.cls.ht?' on':''}">Cần nâng cấp hệ thống</span></div></div>`;
  s+=`<div class="grow metagrid">
      <div><div class="glbl">Đơn vị phối hợp</div><div class="gtxt">${has(g.unit)}</div></div>
      <div><div class="glbl">PIC</div><div class="gtxt">${has(g.pic)}</div></div></div>`;
  if(g.qa) s+=`<div class="grow"><div class="glbl">Note Q&amp;A</div><div class="gtxt">${g.qa}</div></div>`;
  s+=`</div></div>`;
  return s;
}
function khHTML(k,isDef){
  let inner=k.paras.map(paraHTML).join('');
  if(k.chart) inner+=`<div class="chart">${k.chart}${k.chartCap?`<div class="chart-cap">${k.chartCap}</div>`:''}</div>`;
  if(k.note) inner+=`<div class="nbox"><span class="tag">${k.note.tag}</span><div>${k.note.html}</div></div>`;
  if(k.ex) inner+=`<div class="ex-num"><span class="tag">Ví dụ minh họa</span><div>${k.ex}</div></div>`;
  if(k.defs) inner+=defbarHTML(k.defs);
  if(k.arrow) inner+=`<div class="arrow"><span class="ld">→</span>${k.arrow}</div>`;
  if(k.gap) inner+=gapHTML(k.gap);
  const yflag=(k.gap&&k.gap.status==='Y')?`<span class="ygap">GAP</span>`:'';
  const id=isDef?` id="k4-${k.n}"`:'';
  return `<div class="kh"${id} data-n="${k.n}"><div class="kh-hd"><span class="knum">${k.n}</span> ${k.t}${yflag}</div><div class="kh-bd">${inner}</div></div>`;
}

function artPage(a,i,all){
  let s=`<section class="page" id="${a.id}">`;
  s+=`<div class="chapline">${a.chap}</div>`;
  s+=`<div class="eyebrow">${a.eyebrow}</div><h1 class="pt">${a.title}</h1>`;
  if(a.chapNote) s+=`<p class="ps">${a.chapNote}</p>`;
  const gs=a.gapCount>0
    ? `<div class="gapsum"><b>${a.gapCount} GAP</b> được ghi nhận tại điều này</div>`
    : `<div class="gapsum clean"><b>Không phát sinh GAP</b> tại điều này</div>`;
  s+=gs;
  if(a.lead) s+=`<div class="lead">${a.lead}</div>`; else s+=`<div style="height:18px"></div>`;
  s+=a.kh.map(k=>khHTML(k,false)).join('');
  const prev=i>0?`<button class="navbtn" onclick="go('${all[i-1].id}')"><small>← Trước</small>${all[i-1].tab} · ${all[i-1].sub}</button>`:`<button class="navbtn" disabled><small>←</small>Đầu chuỗi</button>`;
  const next=i<all.length-1?`<button class="navbtn next" onclick="go('${all[i+1].id}')"><small>Tiếp →</small>${all[i+1].tab} · ${all[i+1].sub}</button>`:`<button class="navbtn next" disabled><small>→</small>Hết phần đã thực hiện</button>`;
  s+=`<div class="navfoot">${prev}${next}</div>`;
  s+=`</section>`;
  return s;
}
function defPage(){
  let s=`<section class="page" id="d4">`;
  s+=`<div class="chapline">Chương I. QUY ĐỊNH CHUNG</div>`;
  s+=`<div class="eyebrow">Điều 4 · 31 khoản · Tra cứu</div><h1 class="pt">Giải thích từ ngữ</h1>`;
  s+=`<p class="ps">Trong Quy chế này, các từ ngữ dưới đây được hiểu như sau. Dùng ô tìm kiếm để lọc nhanh theo thuật ngữ hoặc nội dung.</p>`;
  s+=`<div class="searchwrap"><div class="searchbox"><span class="ico">🔍</span>
      <input id="q" type="text" placeholder="Tìm thuật ngữ hoặc nội dung… (vd: vega, sổ kinh doanh, hạn mức)" oninput="doSearch()">
      <button onclick="clearSearch()">Xóa</button></div>
      <div class="shits" id="shits"></div></div>`;
  s+=`<div id="deflist">`+DEF.map(k=>khHTML(k,true)).join('')+`</div>`;
  s+=`</section>`;
  return s;
}

const NAV1=ARTS.map(a=>({id:a.id,tab:a.tab,sub:a.sub,gap:a.gapCount}));
function renderNav(){
  document.getElementById('nav1').innerHTML=NAV1.map(n=>
    `<button class="ni" data-id="${n.id}" onclick="go('${n.id}')">${n.tab}${n.gap?`<span class="gapdot">${n.gap} GAP</span>`:''}<small>${n.sub}</small></button>`).join('');
  document.getElementById('nav2').innerHTML=
    `<button class="ni ref" data-id="d4" onclick="go('d4')">Điều 4<small>Giải thích từ ngữ · có tìm kiếm</small></button>`;
  const tot=ARTS.reduce((s,a)=>s+a.gapCount,0);
  document.getElementById('sbfoot').innerHTML=
    `Đã thực hiện: <b>Điều 1, 2, 3, 9, 10</b><br>Tổng GAP ghi nhận: <b>${tot}</b><br>Định nghĩa: <b>31 khoản</b> (Điều 4)`;
}
function renderMain(){
  document.getElementById('main').innerHTML=ARTS.map((a,i)=>artPage(a,i,ARTS)).join('')+defPage();
}
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
  const pg=document.getElementById(id); if(pg) pg.classList.add('active');
  const nb=document.querySelector(`.ni[data-id="${id}"]`); if(nb) nb.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goDef(n){
  go('d4');
  clearSearch();
  setTimeout(()=>{
    const el=document.getElementById('k4-'+n);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  },160);
}
function stripD(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();}
function doSearch(){
  const q=document.getElementById('q').value.trim();
  const list=document.querySelectorAll('#deflist .kh');
  if(!q){list.forEach(k=>k.classList.remove('hidden'));document.getElementById('shits').textContent='';return;}
  const qq=stripD(q); let hit=0;
  list.forEach(k=>{
    const txt=stripD(k.textContent);
    if(txt.includes(qq)){k.classList.remove('hidden');hit++;}else{k.classList.add('hidden');}
  });
  document.getElementById('shits').textContent=hit?`Tìm thấy ${hit} khoản khớp "${q}"`:`Không có khoản nào khớp "${q}"`;
}
function clearSearch(){const i=document.getElementById('q'); if(i){i.value='';} const l=document.querySelectorAll('#deflist .kh'); l.forEach(k=>k.classList.remove('hidden')); const h=document.getElementById('shits'); if(h) h.textContent='';}

/* ================= HIGHLIGHT ================= */
let hlMode=false, erMode=false;
function hint(msg){
  const h=document.getElementById('hlhint');
  if(!msg){h.classList.remove('show');return;}
  h.textContent=msg; h.classList.add('show');
}
function syncHL(){
  document.body.classList.toggle('hl-on',hlMode);
  document.body.classList.toggle('er-on',erMode);
  document.getElementById('btnHL').classList.toggle('on',hlMode);
  document.getElementById('btnER').classList.toggle('on',erMode);
  if(hlMode) hint('Bôi đen đoạn chữ muốn đánh dấu');
  else if(erMode) hint('Bấm vào vùng vàng để xóa đánh dấu');
  else hint('');
}
function toggleHL(){hlMode=!hlMode; if(hlMode) erMode=false; syncHL();}
function toggleER(){erMode=!erMode; if(erMode) hlMode=false; syncHL();}

function inMain(node){
  const m=document.getElementById('main'); if(!m) return false;
  const el=(node.nodeType===3)?node.parentNode:node;
  return !!el && m.contains(el) && !el.closest('svg');
}
function wrapRange(r){
  const sp=document.createElement('span'); sp.className='hl-mark';
  try{ r.surroundContents(sp); return true; }catch(e){ return false; }
}
function highlightSelection(){
  const sel=window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
  const range=sel.getRangeAt(0);
  if(!inMain(range.startContainer) || !inMain(range.endContainer)) return;
  if(range.startContainer===range.endContainer && range.startContainer.nodeType===3){
    wrapRange(range.cloneRange()); sel.removeAllRanges(); return;
  }
  const nodes=[];
  const walker=document.createTreeWalker(range.commonAncestorContainer,NodeFilter.SHOW_TEXT,null);
  let n;
  while(n=walker.nextNode()){
    if(!n.nodeValue || !n.nodeValue.trim()) continue;
    if(!inMain(n)) continue;
    try{ if(!range.intersectsNode(n)) continue; }catch(e){ continue; }
    nodes.push(n);
  }
  nodes.forEach(node=>{
    let s=0, e=node.nodeValue.length;
    if(node===range.startContainer) s=range.startOffset;
    if(node===range.endContainer)   e=range.endOffset;
    if(s>=e) return;
    const r=document.createRange();
    try{ r.setStart(node,s); r.setEnd(node,e); }catch(err){ return; }
    wrapRange(r);
  });
  sel.removeAllRanges();
}
function unwrapMark(m){
  const p=m.parentNode;
  while(m.firstChild) p.insertBefore(m.firstChild,m);
  p.removeChild(m); p.normalize();
}
document.addEventListener('mouseup',e=>{
  if(!hlMode) return;
  if(e.target.closest && e.target.closest('.hltb')) return;
  setTimeout(highlightSelection,0);
});
document.addEventListener('click',e=>{
  if(!erMode) return;
  const m=e.target.closest && e.target.closest('.hl-mark');
  if(m) unwrapMark(m);
});
function clearHL(){
  const pg=document.querySelector('.page.active')||document.getElementById('main');
  const ms=pg.querySelectorAll('.hl-mark');
  if(!ms.length){ hint('Trang này chưa có đánh dấu nào'); setTimeout(()=>{if(!hlMode&&!erMode)hint('')},1600); return; }
  if(!confirm('Xóa toàn bộ '+ms.length+' vùng đã đánh dấu trên trang này?')) return;
  ms.forEach(unwrapMark);
}

renderNav(); renderMain(); go('d1');
