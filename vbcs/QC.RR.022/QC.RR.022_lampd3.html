<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC.RR.022 — Nội dung quy chế &amp; Đánh giá GAP</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#fdf3f0;color:#1a202c;display:flex;min-height:100vh}
.sidebar{width:240px;background:#fff7f4;border-right:1px solid #f5c9b8;padding:22px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand h2{font-family:'Crimson Pro',serif;color:#b83a10;font-size:20px;line-height:1.2}
.sb-brand p{font-size:10.5px;color:#9a4020;margin-top:5px;line-height:1.5}
.sb-lbl{font-size:9px;color:#9a4020;letter-spacing:.8px;font-weight:700;margin:22px 0 8px;text-transform:uppercase;opacity:.7}
nav{display:flex;flex-direction:column;gap:3px}
.ni{padding:10px 12px;border-radius:8px;color:#9a4020;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;border:none;background:none;text-align:left;font-family:inherit;line-height:1.3;width:100%}
.ni:hover{background:#fff3ee;color:#b83a10}
.ni.active{background:#b83a10;color:#fff}
.ni small{display:block;font-size:9.5px;font-weight:500;opacity:.75;margin-top:2px}
.ni .gapdot{display:inline-block;background:#9B2C2C;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:5px;vertical-align:middle}
.ni.active .gapdot{background:#fde8de;color:#9B2C2C}
.ni.ref{border:1px dashed #f5c9b8}
.sb-foot{margin-top:24px;padding-top:16px;border-top:1px solid #f5c9b8;font-size:10px;color:#9a4020;line-height:1.75}
.sb-foot b{color:#b83a10}
main{flex:1;padding:38px 52px;overflow-x:auto;max-width:1000px;margin:0 auto}
.page{display:none;animation:fadeUp .28s ease}.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:12.5px;color:#9a4020;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.pt{font-family:'Crimson Pro',serif;color:#b83a10;font-size:36px;font-weight:700;margin-top:5px;line-height:1.12}
.ps{color:#9a4020;font-size:15.5px;margin-top:9px;line-height:1.5}
.chapline{font-size:11.5px;color:#9a4020;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#fff7f4;border:1px solid #f5c9b8;border-left:4px solid #b83a10;border-radius:0 7px 7px 0;padding:9px 14px;margin:0 0 20px}
.gapsum{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #f5c9b8;border-radius:20px;padding:7px 15px;font-size:13px;color:#9a4020;font-weight:600;margin-top:14px}
.gapsum b{color:#9B2C2C}
.gapsum.clean b{color:#276749}
.lead{font-size:16px;line-height:1.7;color:#2d3748;margin:22px 0 16px;font-weight:500}
.kh{background:#fff;border:1px solid #f5c9b8;border-radius:12px;margin-bottom:20px;overflow:hidden}
.kh-hd{background:#fff7f4;border-bottom:1px solid #f5c9b8;padding:12px 20px;font-weight:700;color:#b83a10;font-size:15.5px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.knum{background:#b83a10;color:#fff;font-size:13px;font-weight:700;min-width:28px;height:28px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.kh-hd .ygap{background:#9B2C2C;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:11px;letter-spacing:.4px}
.kh-bd{padding:16px 20px}
.p0,.p1,.p2,.p3,.p4{font-size:15.5px;line-height:1.72;color:#2d3748;margin-bottom:8px}
.p1{padding-left:24px}.p2{padding-left:48px}.p3{padding-left:70px}.p4{padding-left:92px}
.p0:last-child,.p1:last-child,.p2:last-child,.p3:last-child,.p4:last-child{margin-bottom:0}
.defbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 2px;padding-top:12px;border-top:1px dotted #f0c4b2}
.defbar .lb{font-size:11px;color:#9a4020;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:center;margin-right:2px}
.defchip{background:#fff7f4;border:1px solid #e8a88c;color:#b83a10;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:15px;cursor:pointer;font-family:inherit;transition:.15s}
.defchip:hover{background:#b83a10;color:#fff;border-color:#b83a10}
.arrow{margin-top:15px;background:#fde8de;border-left:4px solid #b83a10;border-radius:0 8px 8px 0;padding:12px 17px;font-size:15px;line-height:1.6;color:#7a2408}
.arrow b{color:#b83a10}
.arrow .ld{font-weight:700;color:#b83a10;margin-right:5px;font-size:17px}
.nbox{background:#fff7ed;border:1px solid #f5c9b8;border-radius:9px;padding:13px 17px;margin-top:14px;font-size:14.5px;line-height:1.62;color:#7a2408}
.nbox .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px;padding:3px 10px;border-radius:11px;background:#fde8de;color:#b83a10}
.nbox b{font-weight:700}
.nbox.nb-n{padding:9px 15px;background:#f7f9f7;border-color:#d8e5da}
.nbox.nb-n .tag{margin-bottom:0;background:#e2efe6;color:#276749}
.ex-num{background:#f4f9f5;border:1px solid #cfe6d6;border-radius:9px;padding:12px 16px;margin-top:12px;font-size:14.5px;line-height:1.62;color:#1f4b32}
.ex-num .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px;padding:3px 10px;border-radius:11px;background:#d1e7d8;color:#276749}
.ex-num b{font-weight:700;color:#1a5c38}
.chart{background:#fff;border:1px solid #f5c9b8;border-radius:10px;padding:16px 18px 10px;margin:15px 0 4px}
.chart svg{width:100%;height:auto;display:block}
.chart-cap{font-size:13px;color:#9a4020;line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px dotted #f0c4b2}
.chart-cap b{color:#b83a10}

/* Tổng hợp thẩm định GAP cho khoản không phát sinh GAP */
.reviewbox{border:1px solid #d8e5da;background:#fbfdfb;border-radius:10px;margin-top:16px;overflow:hidden}
.reviewbox-hd{background:#276749;color:#fff;padding:11px 17px;font-size:14px;font-weight:700}
.reviewitem{padding:15px 17px;border-top:1px solid #e3ece5}
.reviewitem:first-of-type{border-top:none}
.reviewtitle{font-size:14.5px;font-weight:700;color:#1f4b32;margin-bottom:7px}
.reviewsummary{font-size:14px;line-height:1.6;color:#2d3748;margin-bottom:10px}
.reviewgap{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:12px;background:#e2efe6;color:#276749;font-size:11.5px;font-weight:700;letter-spacing:.35px;text-transform:uppercase}
.reviewbox .tuyen{margin-top:5px}
.reviewbox .tcard{border-color:#d8e5da}
.reviewbox .tcard h5{color:#276749}
@media(max-width:760px){.reviewbox .tuyen{grid-template-columns:1fr}}

/* GAP box */
.gapbox{border:1px solid #e0a99a;background:#fffaf8;border-radius:10px;margin-top:16px;overflow:hidden}
.gapbox-hd{background:#9B2C2C;color:#fff;padding:10px 17px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px}
.gapbox-hd .yn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:2px 9px;font-size:12px}
.gapbox-bd{padding:15px 17px}
.grow{margin-bottom:14px}
.grow:last-child{margin-bottom:0}
.glbl{font-size:10.5px;color:#9B2C2C;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px}
.gtxt{font-size:14.5px;line-height:1.62;color:#2d3748}
.tuyen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tcard{background:#fff;border:1px solid #f0d5c9;border-radius:8px;padding:10px 12px}
.tcard h5{font-size:11.5px;color:#b83a10;font-weight:700;margin-bottom:5px;letter-spacing:.3px}
.tcard p{font-size:13.5px;line-height:1.55;color:#2d3748}
.tcard.empty p{color:#c9a99c;font-style:italic}
.clschips{display:flex;gap:7px;flex-wrap:wrap}
.cchip{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:15px;border:1px solid #f0d5c9;background:#fff;color:#c9a99c}
.cchip.on{background:#9B2C2C;border-color:#9B2C2C;color:#fff}
.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Điều 4 search */
.searchwrap{position:sticky;top:0;background:#fdf3f0;padding:14px 0 12px;z-index:5;margin-bottom:6px}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #f5c9b8;border-radius:10px;padding:11px 16px;transition:.15s}
.searchbox:focus-within{border-color:#b83a10}
.searchbox input{flex:1;border:none;outline:none;font-family:inherit;font-size:15.5px;color:#1a202c;background:transparent}
.searchbox input::placeholder{color:#c9a99c}
.searchbox .ico{font-size:16px;color:#b83a10}
.searchbox button{border:none;background:#fff7f4;color:#9a4020;border-radius:6px;padding:5px 11px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.searchbox button:hover{background:#fde8de;color:#b83a10}
.shits{font-size:13px;color:#9a4020;margin-top:9px;font-weight:600}
.kh.hidden{display:none}
mark{background:#ffe08a;color:#7a2408;padding:0 2px;border-radius:2px}
.kh.flash{animation:flash 1.8s ease}
@keyframes flash{0%,18%{box-shadow:0 0 0 4px #f6b45e;border-color:#e8551a}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.navfoot{display:flex;justify-content:space-between;margin-top:26px;gap:14px}
.navbtn{flex:1;background:#fff;border:1px solid #f5c9b8;border-radius:10px;padding:14px 18px;cursor:pointer;font-family:inherit;font-size:14px;color:#9a4020;font-weight:600;transition:.15s;text-align:left}
.navbtn.next{text-align:right}
.navbtn:hover{background:#fde8de;border-color:#b83a10;color:#b83a10}
.navbtn:disabled{opacity:.4;cursor:default}
.navbtn small{display:block;font-size:11.5px;opacity:.7;font-weight:500;margin-bottom:2px}
/* ---- Highlight ---- */
.hl-mark{background:#ffe27a;font-weight:700;color:#4a2d00;border-radius:2px;padding:0 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
body.hl-on main{cursor:text}
body.hl-on main ::selection{background:#ffd24a}
body.er-on .hl-mark{cursor:pointer;outline:1px dashed #9B2C2C;outline-offset:1px}
body.er-on .hl-mark:hover{background:#ffc4c4;text-decoration:line-through}
.hltb{position:fixed;right:22px;bottom:22px;display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #f5c9b8;border-radius:13px;padding:9px 11px;box-shadow:0 6px 22px rgba(184,58,16,.18);z-index:100}
.hltb .tbl{font-size:10px;color:#9a4020;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.65;margin-right:2px}
.hlbtn{border:1px solid #f5c9b8;background:#fff7f4;color:#9a4020;border-radius:9px;padding:9px 13px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.hlbtn:hover{background:#fde8de;border-color:#b83a10;color:#b83a10}
.hlbtn.on{background:#b83a10;border-color:#b83a10;color:#fff}
.hlbtn.er.on{background:#9B2C2C;border-color:#9B2C2C;color:#fff}
.hlbtn.ghost{background:none;border-color:transparent;font-weight:600;color:#9a4020}
.hlbtn.ghost:hover{background:#fff7f4;color:#b83a10}
.hlhint{position:fixed;right:22px;bottom:78px;background:#b83a10;color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;z-index:100;box-shadow:0 4px 14px rgba(184,58,16,.25);display:none}
.hlhint.show{display:block}
@media print{.sidebar,.navfoot,.searchwrap,.hltb,.hlhint{display:none}.page{display:block!important;page-break-after:always}main{max-width:none;margin:0}.kh{break-inside:avoid}
.hl-mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* --- VBCS / Thực hiện --- */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 12px}
.dcell{background:#fff;border:1px solid #e3ece5;border-radius:8px;padding:9px 12px}
.dlbl{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#276749;margin-bottom:5px}
.dval{font-size:14px;line-height:1.55;color:#2d3748;min-height:20px}
.dval.ph{color:#b9c9bd;font-style:italic}
.reviewgap.y{background:#f6dcdc;color:#9B2C2C}
/* --- Chế độ chỉnh sửa --- */
body.editing [contenteditable]{outline:1px dashed #c9a99c;border-radius:3px;padding:1px 3px;min-width:30px}
body.editing [contenteditable]:focus{background:#fffbe8;outline:1.5px solid #b83a10}
body.editing .dval{min-height:24px}
.delitem{float:right;border:1px solid #e7c3c3;background:#fff;color:#9B2C2C;border-radius:6px;
  font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:2px 8px;line-height:1.4}
.delitem:hover{background:#9B2C2C;color:#fff;border-color:#9B2C2C}
.additem{padding:12px 17px;border-top:1px dashed #cfe0d4;background:#f4f9f5}
.additem button{border:1px solid #276749;background:#fff;color:#276749;border-radius:8px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:8px 15px}
.additem button:hover{background:#276749;color:#fff}
.gapsel{margin-top:10px;font-size:12px;font-weight:700;color:#276749;letter-spacing:.3px}
.gapsel select{font-family:inherit;font-size:12.5px;font-weight:700;color:#276749;border:1px solid #cfe0d4;
  border-radius:6px;padding:3px 8px;background:#fff;margin-left:4px}
/* --- Thanh lưu --- */
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f5c9b8;
  padding:10px 20px;display:flex;align-items:center;gap:10px;z-index:99;box-shadow:0 -3px 14px rgba(184,58,16,.08)}
.savebar #sv_msg{flex:1;font-size:12.5px;color:#9a4020;font-weight:600}
.savebar #sv_msg.dirty{color:#9B2C2C}
.sbtn{border:1px solid #f5c9b8;background:#fff7f4;color:#9a4020;border-radius:9px;padding:9px 15px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sbtn:hover{background:#fde8de;border-color:#b83a10;color:#b83a10}
.sbtn.on{background:#276749;border-color:#276749;color:#fff}
.sbtn.primary{background:#b83a10;border-color:#b83a10;color:#fff}
.sbtn.primary:hover{background:#9a2f0e;color:#fff}
body{padding-bottom:66px}
.hltb{bottom:80px}
@media print{.savebar{display:none}}


.reviewbox-hd{cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
.reviewbox-hd:hover{background:#1f5639}
.rbt{flex-shrink:0}
.rbmeta{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.32);
  border-radius:11px;padding:2px 10px;letter-spacing:.2px}
.rbmeta.y{background:#f6dcdc;color:#9B2C2C;border-color:#f6dcdc}
.rbchev{margin-left:auto;font-size:13px;transition:transform .18s}
.reviewbox.collapsed .rbchev{transform:rotate(-90deg)}
.reviewbox.collapsed .reviewbody{display:none}
.rbtools{padding:9px 17px;border-top:1px solid #e3ece5;background:#f4f9f5}
.rbtools button{border:1px solid #cfe0d4;background:#fff;color:#276749;border-radius:7px;
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:5px 12px}
.rbtools button:hover{background:#276749;color:#fff;border-color:#276749}
.reviewtitle{cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;flex-wrap:wrap}
.itchev{font-size:11px;color:#276749;transition:transform .18s;flex-shrink:0}
.reviewitem.collapsed .itchev{transform:rotate(-90deg)}
.reviewitem.collapsed .itembody{display:none}
.reviewitem.collapsed{padding-bottom:13px}
.itgap{margin-left:auto;font-size:11px;font-weight:700;background:#e2efe6;color:#276749;
  border-radius:10px;padding:2px 9px;flex-shrink:0}
.itgap.y{background:#f6dcdc;color:#9B2C2C}
@media print{.reviewbox.collapsed .reviewbody{display:block!important}
 .reviewitem.collapsed .itembody{display:block!important}.rbtools,.rbchev,.itchev{display:none}}


@media (max-width:1150px){
  .tuyen{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  main{padding:28px 24px}
}
@media (max-width:820px){
  .sidebar{width:180px}
  .savebar{flex-wrap:wrap;gap:7px}
  .savebar #sv_msg{flex-basis:100%}
}

.rnote{background:#fff7ed;border:1px solid #f0d9b8;border-left:3px solid #d98324;
  border-radius:0 8px 8px 0;padding:11px 15px;margin-top:12px;font-size:14px;line-height:1.6;color:#7a4a08}
.rnote.ph{opacity:.5}
.rntag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  margin-bottom:6px;padding:3px 10px;border-radius:11px;background:#fbe7c8;color:#8a5a10}
.rnote b{font-weight:700;color:#6b3d05}

.unbox{border:1px solid #cdd7e5;background:#f7f9fc;border-radius:10px;margin-top:14px;overflow:hidden}
.unhd{background:#eef2f8;border-bottom:1px solid #dde4ee;padding:10px 16px;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:#33495e}
.unhd:hover{background:#e5ecf6}
.unchev{font-size:11px;transition:transform .18s;color:#5a7290}
.unbox.collapsed .unchev{transform:rotate(-90deg)}
.unbox.collapsed .unbody{display:none}
.untitle{flex:1}
.unflag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  background:#d8e6f5;color:#2c5b87;border-radius:10px;padding:2px 9px}
.unflag.empty{background:#e8ecf1;color:#93a3b5}
.unbody{padding:13px 16px}
.unval{min-height:64px;background:#fff;border:1px dashed #b9c8dc;border-radius:8px;padding:11px 14px;
  font-size:14.5px;line-height:1.62;color:#2d3748;outline:none}
.unval:focus{border-style:solid;border-color:#4b7bab;background:#fffdf5}
.unval.ph:empty:before{content:'Gõ ghi chú của bạn tại đây…';color:#a9b8c9;font-style:italic}
.unhint{font-size:11.5px;color:#8496a8;margin-top:7px}
@media print{.unbox.collapsed .unbody{display:block!important}.unhint,.unchev{display:none}}

/* ---- ẩn/hiện thanh tab ---- */
.navtoggle{position:fixed;left:240px;top:16px;z-index:120;width:22px;height:44px;border:1px solid #f5c9b8;
  border-left:none;border-radius:0 8px 8px 0;background:#fff7f4;color:#b83a10;font-size:13px;font-weight:700;
  cursor:pointer;transition:left .18s}
.navtoggle:hover{background:#fde8de}
body.navhidden .sidebar{display:none}
body.navhidden .navtoggle{left:0}
body.navhidden main{max-width:1600px}
/* ---- xem song song ---- */
.splitwrap{border-top:1px solid #f5c9b8}
.splithd{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:0;z-index:6;
  background:#b83a10;color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.splithd>div{padding:8px 15px}
.splithd>div:first-child{border-right:1px solid rgba(255,255,255,.3)}
.srow{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ecd7cc;align-items:stretch}
.srow:last-child{border-bottom:none}
.srow:nth-child(even){background:#fffaf8}
.scl{padding:13px 16px;border-right:1px solid #ecd7cc}
.scr{padding:13px 16px;background:#f8fbf9}
.scl .p0,.scl .p1,.scl .p2,.scl .p3,.scl .p4{font-size:14.5px;line-height:1.62;margin-bottom:6px}
.scl .p1{padding-left:14px}.scl .p2{padding-left:28px}.scl .p3{padding-left:42px}.scl .p4{padding-left:56px}
.asmhd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}

</style><script id="savedrev">window.__SAVED_REVIEWS={"d10|1":{"r":[{"ref":"a","title":"Xác định khoản mục thuộc Sổ kinh doanh","summary":"Xác định đúng sản phẩm, giao dịch, danh mục hoặc khoản mục thuộc Sổ kinh doanh theo quy định nội bộ của MSB — bước nền để xác định đúng đối tượng chịu rủi ro.","vbcs":"QĐ.RR.014, QC.RR.022","thuchien":"Định kỳ Market Risk gửi email các bên liên quan xác nhận tiêu chí phân tách. Quản lý và báo cáo dựa trên phân tách book.","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(ii)<\/b> — Đánh giá độc lập và thách thức tính đầy đủ, phù hợp của việc nhận dạng RRTT do Tuyến 1 thực hiện.","t3":"Đánh giá tính chính xác của việc xác định đối tượng thuộc Sổ kinh doanh.","gap":"N"},{"ref":"b(i)","title":"Phân loại theo risk class","summary":"Phân loại RRTT theo bốn nhóm rủi ro chính: lãi suất, ngoại hối, giá cổ phiếu và giá hàng hóa. Quy chế bao phủ trọn phạm vi, không yêu cầu MSB phải phát sinh hoạt động ở cả bốn nhóm.","vbcs":"QC.RR.022, QĐ.7731","thuchien":"","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT.","t3":"Đánh giá tính đầy đủ của việc phân loại theo bản chất rủi ro chính.","gap":"N"},{"ref":"b(ii)","title":"Phân loại theo Delta, Vega và Curvature","summary":"Phân loại RRTT theo ba đặc tính độ nhạy Delta, Vega và Curvature, phù hợp với phương pháp luận SBM của Basel, áp dụng cho từng risk class phù hợp. Yêu cầu tại đây là <b>nhận dạng và phân loại<\/b> theo độ nhạy; việc thực hiện đầy đủ phép tính SBM thuộc phạm vi đo lường tại Điều 11.","vbcs":"QC.RR.022, QĐ.7731","thuchien":"","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT.","t3":"Đánh giá tính phù hợp của khung phân loại rủi ro theo độ nhạy.","gap":"N","note":"Điều 10 b(ii) mô tả rủi ro vega là <b>\"giá trị công cụ thay đổi...\"<\/b>, trong khi Điều 4 Khoản 8 định nghĩa đầy đủ là <b>\"giá trị công cụ, giao dịch hoặc danh mục thay đổi...\"<\/b>. Rủi ro delta ngay trong cùng b(ii) đã chép đúng đủ cụm này. Đề xuất bổ sung cụm <b>\"giao dịch hoặc danh mục\"<\/b> vào phần vega — và cân nhắc cả curvature — để đồng bộ với Điều 4."},{"ref":"b(iii)","title":"Phân loại bổ sung GIRR, CSR, Curve risk và Basis risk","summary":"Cụm <b>\"có thể\"<\/b> trao quyền phân loại bổ sung theo mục tiêu quản trị từng thời kỳ, không tạo nghĩa vụ bắt buộc phải triển khai đồng thời cả bốn nhóm rủi ro thành phần.","vbcs":"QC.RR.022","thuchien":"Chưa tách riêng GIRR/CSR/curve/basis; hiện theo dõi qua PV01 tổng theo kỳ hạn (báo cáo RRTT hằng ngày mục 2, 3.1–3.2).","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT.","t3":"Đánh giá sự phù hợp giữa phạm vi phân loại bổ sung và nhu cầu quản trị.","gap":"N"},{"ref":"b(iv)","title":"Các phân loại RRTT khác","summary":"Điều khoản mở, cho phép bổ sung cách phân loại khác theo quy định pháp luật và nhu cầu quản trị; không bắt buộc hình thành ngay một nhóm phân loại mới.","vbcs":"QC.RR.008, QC.RR.022","thuchien":"","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT.","t3":"Đánh giá khả năng tiếp nhận các phân loại rủi ro mới của hệ thống hiện hành.","gap":"N"},{"ref":"c","title":"Nhận dạng rủi ro tập trung trong hoạt động tự doanh","summary":"Nhận dạng rủi ro tập trung đối với hoạt động giao dịch tự doanh trên đủ ba phạm vi ghi nhận: khoản mục nội bảng, khoản mục ngoại bảng và khoản mục chưa được hạch toán theo pháp luật về kế toán.","vbcs":"QC.RR.022, QĐ.7731","thuchien":"Theo dõi trạng thái rủi ro tập trung trên 3 lớp: nội bảng đã thanh toán, ngoại bảng đã valid chưa thanh toán, ngoài BS chưa valid (báo cáo RRTT hằng ngày mục 3.2, 3.3). Bucket theo kỳ hạn (Tenor), tổ chức phát hành (issuer, rating), loại hình phát hành (TPCP/TPCPBL/TPCQDP). -&gt; Bản chất để nhìn ra rủi ro tập trung&nbsp;<br>FX theo currency; DR: theo kỳ hạn, sản phẩm, currency","t1":"Chủ động nhận dạng GD (có phải tự doanh không) -&gt; nếu là GD tự doanh -&gt; nhận dạng rủi ro tập trung đối với các giao dịch tự doanh (phạm vi: On, off, ngoài để đánh giá RR tập trung)","t2":"&nbsp;Thẩm định quá trình nhận dạng của T1 -&gt; Nhận dạng đã đầy đủ, hợp lý chưa (phải challenge T1).&nbsp;<br>Hướng dẫn nhận dạng rủi ro tập trung cho T1, đưa ra đầy đủ checklist, tiêu chí để phục vụ nhận dạng rủi ro tập trung&nbsp;","t3":"Đánh giá tính đầy đủ của phạm vi nhận dạng rủi ro tập trung.","gap":"N"},{"ref":"d","title":"Nhận dạng các yếu tố rủi ro thị trường","summary":"Nhận dạng các yếu tố rủi ro thị trường tác động đến sản phẩm, giao dịch hoặc danh mục. Danh sách trong quy chế là danh sách mở (\"bao gồm nhưng không giới hạn\"), cho phép bổ sung yếu tố khác khi phù hợp. Năng lực tính toán chi tiết từng sensitivity thuộc phần đo lường tại Điều 11.","vbcs":"QC.RR.022, QĐ.7731","thuchien":"Theo dõi hằng ngày: lãi suất trúng thầu sơ cấp, yield thứ cấp theo kỳ hạn, bid-ask spread, tương quan lợi suất danh mục và chi phí nguồn Repo (báo cáo RRTT hằng ngày mục 5, 6.2, 6.3).","t1":"<b>K3.a(iii)<\/b> — Xác định nguồn gốc phát sinh rủi ro, yếu tố rủi ro thị trường tác động và cơ chế ảnh hưởng đến sản phẩm, giao dịch, danh mục hoặc hoạt động nghiệp vụ.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT + vai trò thẩm định T1","t3":"Đánh giá tính đầy đủ của các yếu tố rủi ro được nhận dạng.","gap":"N"},{"ref":"e","title":"Hệ thống, dữ liệu và nguồn thông tin","summary":"Xác định và truy vết được hệ thống ghi nhận giao dịch, kho dữ liệu, nguồn giá và nguồn thông tin phục vụ quản lý, đo lường, giám sát và báo cáo RRTT.Trong quá trình nhận dạng -&gt; hệ thống ghi nhận giao dịch là gì, lưu trữ ra sao, nguồn thông tin","vbcs":"QĐ.RR.014, QC.RR.022","thuchien":"Khi nhận dạng các sản phẩm -&gt; nhận biết được sẽ ghi nhận trên hệ thống như nào (Kondor, T24), Database lưu trữ như nào (Baselmart, Workzone, ... ), nguồn thông tin có khả năng truy xuất và đối chiếu. -&gt; hỗ trợ quản lý, đo lường, giám sát và báo cáo RRTT","t1":"<b>K3.a(iv)<\/b> — Cung cấp đầy đủ, kịp thời thông tin cần thiết phục vụ nhận dạng RRTT theo yêu cầu của Tuyến 2.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT.","t3":"Đánh giá tính tin cậy và khả năng truy vết của hệ thống dữ liệu RRTT.","gap":"N"},{"ref":"f","title":"Đánh giá khả năng định giá","summary":"Đánh giá khả năng định giá, nguồn giá, dữ liệu thị trường, mô hình định giá, mức độ thanh khoản và các yếu tố có thể làm sai lệch giá trị ghi nhận hoặc lãi/lỗ đánh giá lại. Nếu không&nbsp;định giá được -&gt; không được ở sổ Kinh doanh","vbcs":"QĐ.RR.014, QĐ.RR.012, QĐ.RR.044","thuchien":"MR phối hợp với MHCC (Mô hình &amp; Công cụ) xây dựng mô hình MtM, Mark-to-Model<br>Không định giá được -&gt; BB<br>Liệu có định giá được không, MtM, ... trước khi golive các sản phẩm mới<br>Đo lường, định giá với giả định là mua bán được với giá mid -&gt; thị trường phải đảm bảo mua được bán được -&gt; nếu xảy ra, định giá thận trọng<br>","t1":"Cung cấp cách định giá sản phẩm, nguồn giá tham chiếu, dữ liệu thị trường để pricing.<br>Đưa ra ý kiến thêm với mô hình định giá<br>Đưa ra khả năng mua bán/phòng ngừa rủi ro với sản phẩm, tự đánh giá thanh khoản thị trường","t2":"Thẩm định lại định giá sản phẩm, dữ liệu thị trường, nguồn giá tham chiếu - IPV, mô hình định giá - làm việc với MHCC, xây dựng các mô hình Mark-to-Market, Mark-to-Model<br>Tự đánh giá lại thanh khoản thị trường.","t3":"<br>","gap":"N"},{"ref":"g","title":"Đánh giá khả năng phòng ngừa rủi ro","summary":"Đánh giá liệu các RRTT đã nhận dạng có thể được phòng ngừa hay không. Quy chế yêu cầu <b>đánh giá khả năng<\/b> phòng ngừa, không bắt buộc mọi rủi ro phải được phòng ngừa; việc thực hiện phòng ngừa thuộc phạm vi Điều 17. (một trong các tiêu chí để sp thuộc TB)","vbcs":"QĐ.RR.014, QC.RR.022","thuchien":"Có năng lực hedge (Spot, Fw, Swap, Option, Futures, công cụ MM)","t1":"T1 tự đánh giá khả năng phòng ngừa rủi ro thị trường của sản phẩm","t2":"Thẩm định lại đánh giá của T1 về khả năng phòng ngừa rủi ro của sản phẩm","t3":"<br>","gap":"N"}],"u":""},"d10|2":{"r":[{"ref":"a","title":"Rà soát theo Bảng ma trận rủi ro toàn diện","summary":"Nhận dạng thông qua rà soát sản phẩm, giao dịch, danh mục, trading desk và nghiệp vụ trọng yếu, đối chiếu với Bảng ma trận rủi ro toàn diện tại Phụ lục thuộc QC.RR.008.","vbcs":"QC.RR.008","thuchien":"Định kỳ rà soát từng loại sản phẩm, rủi ro theo bảng ma trận rủi ro toàn diện tại QC.RR.008.","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(i)<\/b> — Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT.","t3":"Đánh giá tính đầy đủ của phạm vi rà soát rủi ro.","gap":"N","note":"Quy chế dẫn chiếu <b>PL01/QC.RR.008<\/b> là <b>sai<\/b>. Đã đối chiếu QC.RR.008 (Lần 11): PL01 là <i>Cấu trúc hệ thống văn bản QLRR và thẩm quyền phê duyệt<\/i>; <b>PL03 mới là Bảng ma trận rủi ro toàn diện<\/b>. Đề xuất sửa dẫn chiếu thành <b>PL03/QC.RR.008<\/b>. Đây là lỗi dẫn chiếu, không phải GAP thực hiện."},{"ref":"b","title":"Nhận dạng trong khâu lập kế hoạch","summary":"Nhận dạng ngay trong quá trình lập kế hoạch kinh doanh, thiết lập khẩu vị rủi ro, hạn mức, chiến lược danh mục và kế hoạch phòng ngừa — quản trị rủi ro đi trước hoặc đi cùng quyết định kinh doanh.","vbcs":"QC.RR.008, QĐ.7731, QĐ.RR.012","thuchien":"","t1":"<b>K3.a(ii)<\/b> — Nhận dạng RRTT ngay từ giai đoạn xây dựng kế hoạch kinh doanh, phát triển sản phẩm mới, nghiệp vụ mới, thị trường mới hoặc thay đổi trọng yếu có liên quan.","t2":"<b>K3.b(ii)<\/b> — Đánh giá độc lập và thách thức tính đầy đủ, phù hợp của việc nhận dạng RRTT do Tuyến 1 thực hiện.","t3":"Đánh giá việc tuân thủ quy trình nhận dạng tại khâu lập kế hoạch.","gap":"N"},{"ref":"c","title":"Nhận dạng khi phê duyệt sản phẩm, nghiệp vụ, thị trường mới","summary":"Nhận dạng khi phê duyệt, triển khai hoặc thay đổi trọng yếu đối với sản phẩm, nghiệp vụ, thị trường mới, mô hình định giá, nguồn dữ liệu, hệ thống hoặc cơ chế kiểm soát. Quy chế yêu cầu RRTT được nhận dạng trong quá trình phê duyệt, không giao quyền phê duyệt cuối cùng cho QLRRTT.","vbcs":"QC.RR.008, QC.RR.022","thuchien":"Khi nhận được thông tin sản phẩm/nghiệp vụ mới, QLRR nhận diện rủi ro, đo lường tính toán (rà soát bộ chỉ số, mô hình), đánh giá phù hợp quy định, tuân thủ hạn mức trước khi đưa vào giao dịch.","t1":"<b>K3.a(ii)<\/b> — Nhận dạng RRTT ngay từ giai đoạn xây dựng kế hoạch kinh doanh, phát triển sản phẩm mới, nghiệp vụ mới, thị trường mới hoặc thay đổi trọng yếu có liên quan.","t2":"<b>K3.b(ii)<\/b> — Đánh giá độc lập và thách thức tính đầy đủ, phù hợp của việc nhận dạng RRTT do Tuyến 1 thực hiện.","t3":"Kiểm tra việc tuân thủ quy trình phê duyệt sản phẩm và nghiệp vụ mới.","gap":"N"},{"ref":"d","title":"Theo dõi thị trường và cảnh báo sớm (Điều 14)","summary":"Nhận dạng liên tục trong quá trình theo dõi và kiểm soát theo Điều 14: diễn biến thị trường, sự kiện bất thường, sự kiện vĩ mô và giám sát hệ thống chỉ số cảnh báo sớm. Tần suất cập nhật phù hợp với tốc độ và mức độ trọng yếu của sự kiện, không bắt buộc real time.","vbcs":"QC.RR.022, QĐ.RR.012","thuchien":"","t1":"<b>K3.a(i)<\/b> — Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý.","t2":"<b>K3.b(iii)<\/b> — Nhận dạng, cập nhật các rủi ro mới phát sinh, rủi ro tiềm ẩn hoặc rủi ro chưa được nhận diện đầy đủ thông qua theo dõi thị trường, chỉ số cảnh báo sớm, kết quả đo lường, kiểm tra giá độc lập, stress testing và các sự kiện rủi ro liên quan.","t3":"Đánh giá hiệu lực của cơ chế theo dõi và cảnh báo sớm.","gap":"N"},{"ref":"e","title":"Kiểm tra sức chịu đựng và phân tích kịch bản","summary":"Nhận dạng qua kiểm tra sức chịu đựng và phân tích kịch bản bất lợi, bao gồm đánh giá mức độ thanh khoản theo khối lượng và thời gian thoát vị thế. \"Thanh khoản\" tại đây gồm cả market liquidity, không chỉ funding liquidity.","vbcs":"QC.RR.024, QĐ.RR.072, QT.TC.019","thuchien":"VaR95%/99% theo 1/10/20 ngày (historical simulation, 252 kịch bản); kịch bản khảo sát VIRA đối chiếu dự báo thị trường (báo cáo RRTT hằng ngày mục 4).","t1":"<b>K3.a(iv)<\/b> — Cung cấp đầy đủ, kịp thời thông tin cần thiết phục vụ nhận dạng RRTT theo yêu cầu của Tuyến 2.","t2":"<b>K3.b(iii)<\/b> — Nhận dạng, cập nhật các rủi ro mới phát sinh, rủi ro tiềm ẩn hoặc rủi ro chưa được nhận diện đầy đủ thông qua theo dõi thị trường, chỉ số cảnh báo sớm, kết quả đo lường, kiểm tra giá độc lập, stress testing và các sự kiện rủi ro liên quan.","t3":"Đánh giá phương pháp và quy trình thực hiện stress test.","gap":"N"},{"ref":"f","title":"Backtesting, IPV, validation và sự kiện thực tế","summary":"Nhận dạng qua rà soát kết quả đo lường (backtesting), kiểm tra giá độc lập (IPV), đánh giá mô hình (validation), vi phạm hạn mức, tổn thất thực tế và ngoại lệ. Không bắt buộc mọi sản phẩm đồng thời có đủ ba công cụ; công cụ nào có áp dụng thì kết quả phải được phản hồi vào quản trị.","vbcs":"QĐ.RR.012, QĐ.RR.044","thuchien":"MR phối hợp với MHCC (Mô hình & Công cụ) backtest và IPV định kỳ. Vi phạm hạn mức và ngoại lệ được ghi nhận, phân tích nguyên nhân và backdate khi cần.","t1":"<b>K3.a(iv)<\/b> — Cung cấp đầy đủ, kịp thời thông tin cần thiết phục vụ nhận dạng RRTT theo yêu cầu của Tuyến 2.","t2":"<b>K3.b(iii)<\/b> — Nhận dạng, cập nhật các rủi ro mới phát sinh, rủi ro tiềm ẩn hoặc rủi ro chưa được nhận diện đầy đủ thông qua theo dõi thị trường, chỉ số cảnh báo sớm, kết quả đo lường, kiểm tra giá độc lập, stress testing và các sự kiện rủi ro liên quan.","t3":"Kiểm toán tính hợp lệ của backtesting, kiểm tra giá độc lập và đánh giá mô hình.","gap":"N"},{"ref":"g","title":"Thông tin và khuyến nghị từ các đơn vị liên quan","summary":"Nhận dạng qua thông tin, báo cáo, cảnh báo hoặc khuyến nghị từ các đơn vị liên quan, bao gồm cả kiểm toán nội bộ. Không bắt buộc mỗi đơn vị lập một báo cáo RRTT riêng; việc liệt kê KTNB không biến Tuyến 3 thành đơn vị nhận dạng thường xuyên.","vbcs":"QC.RR.008, QC.RR.022","thuchien":"Tiếp nhận thông tin qua hệ thống, số liệu quản lý hiệu suất (QLHS) và đội kinh doanh — các đầu mối cung cấp số liệu đầu vào cho nhận dạng RRTT.","t1":"<b>K3.a(iv)<\/b> — Cung cấp đầy đủ, kịp thời thông tin cần thiết phục vụ nhận dạng RRTT theo yêu cầu của Tuyến 2.","t2":"<b>K3.b(v)<\/b> — Tổng hợp các vấn đề trọng yếu trong nhận dạng RRTT để phục vụ các bước đo lường, giám sát, kiểm soát và báo cáo theo quy định.","t3":"Cung cấp cảnh báo, khuyến nghị từ kết quả kiểm toán làm đầu vào nhận dạng.","gap":"N"},{"ref":"h(i)","title":"Tương tác chéo — Rủi ro thanh khoản","summary":"Suy giảm thanh khoản nguồn vốn hoặc thanh khoản thị trường có thể làm giảm khả năng đóng/mở trạng thái, mở rộng bid-ask spread, tăng haircut hoặc buộc phải đóng trạng thái trong điều kiện bất lợi. QLRRTT chịu trách nhiệm đánh giá phần tác động tới trạng thái, P&amp;L, vốn và hạn mức.","vbcs":"QC.RR.021, QC.RR.024","thuchien":"","t1":"<b>K3.a(iii)<\/b> — Xác định nguồn gốc phát sinh rủi ro, yếu tố rủi ro thị trường tác động và cơ chế ảnh hưởng đến sản phẩm, giao dịch, danh mục hoặc hoạt động nghiệp vụ.","t2":"<b>K3.b(iv)<\/b> — Phân tích mức độ tương tác chéo giữa RRTT với các rủi ro trọng yếu khác.","t3":"Đánh giá sự phối hợp giữa quản lý RRTT và rủi ro thanh khoản.","gap":"N"},{"ref":"h(ii)","title":"Tương tác chéo — Rủi ro tín dụng đối tác và thanh toán","summary":"Đối tác không thực hiện hoặc không có khả năng thực hiện nghĩa vụ có thể làm phát sinh, thay đổi hoặc kéo dài trạng thái RRTT ngoài dự kiến, đặc biệt với phái sinh, ngoại hối, repo và các giao dịch chưa hoàn tất thanh toán.","vbcs":"QC.RR.008, QC.RR.022","thuchien":"Phối hợp với đội Back Office (BO) đối với các giao dịch chưa hoàn tất, chậm thanh toán hoặc đối tác không thực hiện nghĩa vụ.","t1":"<b>K3.a(iv)<\/b> — Cung cấp đầy đủ, kịp thời thông tin cần thiết phục vụ nhận dạng RRTT theo yêu cầu của Tuyến 2.","t2":"<b>K3.b(iv)<\/b> — Phân tích mức độ tương tác chéo giữa RRTT với các rủi ro trọng yếu khác.","t3":"Đánh giá sự phối hợp giữa quản lý RRTT và rủi ro tín dụng đối tác.","gap":"N","note":"Các điểm <b>h(iii) đến h(vii)<\/b> (credit spread; mô hình – dữ liệu – định giá; rủi ro hoạt động, pháp lý, tuân thủ; rủi ro lãi suất trên sổ ngân hàng; các rủi ro trọng yếu khác) <b>thuộc phạm vi phụ trách của PIC khác<\/b>, không đánh giá tại đây."}],"u":""},"d10|3":{"r":[{"ref":"3","title":"Cơ chế phối hợp theo mô hình ba tuyến bảo vệ","summary":"Xác lập cơ chế phối hợp nhận dạng RRTT theo mô hình ba tuyến bảo vệ, phù hợp với chức năng, nhiệm vụ và thẩm quyền của từng đơn vị. Tuyến 1 sở hữu rủi ro và nhận dạng tại nguồn; Tuyến 2 thiết lập phương pháp, đánh giá độc lập và tổng hợp; Tuyến 3 đánh giá độc lập hiệu lực của khung quản trị, không tham gia vận hành thường xuyên.","vbcs":"QC.RR.008, QC.RR.022","thuchien":"Tham chiếu chức năng nhiệm vụ → xem QC.RR.008.","t1":"<b>K3.a<\/b> — <b>(i)<\/b> Chủ động nhận dạng rủi ro theo quy định tại Khoản 1 Điều này trong phạm vi nghiệp vụ quản lý. <b>(ii)<\/b> Nhận dạng RRTT ngay từ giai đoạn xây dựng kế hoạch kinh doanh, phát triển sản phẩm mới, nghiệp vụ mới, thị trường mới hoặc thay đổi trọng yếu có liên quan. <b>(iii)<\/b> Xác định nguồn gốc phát sinh rủi ro, yếu tố rủi ro thị trường tác động và cơ chế ảnh hưởng đến sản phẩm, giao dịch, danh mục hoặc hoạt động nghiệp vụ. <b>(iv)<\/b> Cung cấp đầy đủ, kịp thời thông tin cần thiết phục vụ nhận dạng RRTT theo yêu cầu của Tuyến 2.","t2":"<b>K3.b<\/b> — <b>(i)<\/b> Thiết lập, hướng dẫn phương pháp, tiêu chí và yêu cầu thông tin phục vụ nhận dạng RRTT. <b>(ii)<\/b> Đánh giá độc lập và thách thức tính đầy đủ, phù hợp của việc nhận dạng RRTT do Tuyến 1 thực hiện. <b>(iii)<\/b> Nhận dạng, cập nhật các rủi ro mới phát sinh, rủi ro tiềm ẩn hoặc rủi ro chưa được nhận diện đầy đủ thông qua theo dõi thị trường, chỉ số cảnh báo sớm, kết quả đo lường, kiểm tra giá độc lập, stress testing và các sự kiện rủi ro liên quan. <b>(iv)<\/b> Phân tích mức độ tương tác chéo giữa RRTT với các rủi ro trọng yếu khác. <b>(v)<\/b> Tổng hợp các vấn đề trọng yếu trong nhận dạng RRTT để phục vụ các bước đo lường, giám sát, kiểm soát và báo cáo theo quy định.","t3":"Đánh giá độc lập, định kỳ tính đầy đủ và hiệu lực của cơ chế nhận dạng RRTT do Tuyến 1 và Tuyến 2 thực hiện.","gap":"N","note":"<b>1.<\/b> Khoản 3 nêu \"mô hình ba tuyến bảo vệ\" nhưng chỉ liệt kê Tuyến 1 và Tuyến 2. Đề xuất bổ sung điểm c) — <i>Tuyến 3: Đánh giá độc lập, định kỳ tính đầy đủ và hiệu lực của cơ chế nhận dạng RRTT do Tuyến 1 và Tuyến 2 thực hiện.<\/i><br><b>2.<\/b> Điểm a(iv): bổ sung trách nhiệm Tuyến 1 <b>chủ động thông báo<\/b> khi phát hiện rủi ro mới hoặc sự kiện bất thường, không chỉ cung cấp theo yêu cầu của Tuyến 2.<br><b>3.<\/b> Điểm b(i): cân nhắc sửa động từ <b>\"thiết lập\"<\/b> thành <b>\"xây dựng, trình cấp có thẩm quyền phê duyệt và hướng dẫn\"<\/b> cho phù hợp phân cấp thẩm quyền."}],"u":""}};</script></head><body class="navhidden hl-on">

const P=(l,t)=>({l,t});

/* ============ ĐỊNH NGHĨA ĐIỀU 4 (31 khoản, nguyên văn) ============ */
const DEF=[
{n:'1',t:'Rủi ro thị trường (RRTT)',paras:[
P(0,'1. Rủi ro thị trường (RRTT): Là rủi ro do biến động bất lợi của lãi suất, tỷ giá, giá vàng, giá chứng khoán và giá hàng hóa trên thị trường. Rủi ro thị trường bao gồm:'),
P(1,'a) Rủi ro lãi suất: Là rủi ro do biến động bất lợi của lãi suất trên thị trường đối với giá trị của giấy tờ có giá, công cụ tài chính có lãi suất, sản phẩm phái sinh lãi suất trên sổ kinh doanh của MSB;'),
P(1,'b) Rủi ro ngoại hối: Là rủi ro do biến động bất lợi của tỷ giá, giá vàng trên thị trường khi MSB có trạng thái ngoại tệ, trạng thái vàng;'),
P(1,'c) Rủi ro giá cổ phiếu: Là rủi ro do biến động bất lợi của giá cổ phiếu trên thị trường đối với giá trị của cổ phiếu, giá trị chứng khoán phái sinh trên sổ kinh doanh (nếu có) của MSB;'),
P(1,'d) Rủi ro giá hàng hóa: Là rủi ro do biến động bất lợi của giá hàng hóa trên thị trường đối với giá trị của sản phẩm phái sinh hàng hóa, giá trị của sản phẩm trong giao dịch giao ngay chịu rủi ro giá hàng hóa của MSB.')],
arrow:'biến động bất lợi 5 loại giá (lãi suất / tỷ giá / vàng / cổ phiếu / hàng hóa), chia <b>4 cấu phần</b>: lãi suất · ngoại hối (gồm vàng) · giá cổ phiếu · giá hàng hóa.'},

{n:'2',t:'Rủi ro tập trung',paras:[
P(0,'2. Rủi ro tập trung đối với hoạt động giao dịch tự doanh theo sản phẩm (sau đây gọi là rủi ro tập trung): Là rủi ro do MSB có hoạt động kinh doanh tập trung vào một sản phẩm ở mức độ có tác động đáng kể theo quy định nội bộ MSB đến thu nhập, trạng thái rủi ro của MSB.')],
arrow:'dồn quá nhiều vào một sản phẩm tự doanh tới mức tác động đáng kể đến thu nhập / trạng thái rủi ro; ngưỡng "đáng kể" theo quy định nội bộ.'},

{n:'3',t:'Rủi ro lãi suất chung (GIRR)',paras:[
P(0,'3. Rủi ro lãi suất chung (general interest rate risk - GIRR): là rủi ro phát sinh do biến động của các yếu tố lãi suất chung/lãi suất phi rủi ro/lãi suất tham chiếu trên thị trường, bao gồm mức lãi suất, đường cong lãi suất, chênh lệch giữa các đường cong lãi suất và độ biến động lãi suất, làm thay đổi bất lợi giá trị công cụ, giao dịch hoặc danh mục của MSB.')],
arrow:'rủi ro từ lãi suất "phi rủi ro / tham chiếu" chung của thị trường, gồm <b>4 chiều</b>: mức · đường cong · chênh lệch đường cong · độ biến động.'},

{n:'4',t:'Rủi ro chênh lệch tín dụng (CSR)',paras:[
P(0,'4. Rủi ro chênh lệch tín dụng (credit spread risk - CSR): là rủi ro phát sinh từ biến động bất lợi của chênh lệch tín dụng (credit spread) do tác động của thay đổi xếp hạng tín nhiệm, chất lượng tín dụng hoặc kỳ vọng thị trường về rủi ro tín dụng của tổ chức phát hành hoặc đối tác, biến động này làm thay đổi giá trị thị trường của công cụ tài chính thuộc phạm vi quản lý rủi ro thị trường.')],
arrow:'rủi ro khi phần bù tín dụng (spread) của tổ chức phát hành / đối tác giãn ra do hạ xếp hạng / xấu chất lượng tín dụng / kỳ vọng thị trường, làm rớt giá công cụ.'},

{n:'5',t:'Rủi ro cơ sở (basis risk)',paras:[
P(0,'5. Rủi ro cơ sở (basis risk): là rủi ro phát sinh từ sự biến động không đồng nhất hoặc không tương quan hoàn hảo giữa các yếu tố thị trường có liên quan, bao gồm nhưng không giới hạn các chỉ số tham chiếu, đường cong, kỳ hạn, đồng tiền, công cụ, thị trường hoặc giữa đối tượng được phòng ngừa và công cụ phòng ngừa, dẫn đến biến động bất lợi đối với giá trị công cụ, giao dịch, danh mục hoặc hiệu quả phòng ngừa rủi ro (ví dụ chênh lệch biến động giữa lãi suất VNIBOR và lãi suất trái phiếu Chính phủ, giữa hai kỳ hạn trên cùng đường cong lãi suất, giữa trái phiếu và hợp đồng phòng ngừa liên quan, hoặc giữa giao dịch gốc và giao dịch hedge không cùng chỉ số/kỳ hạn/đồng tiền).')],
chart:'<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg"><line x1="64" y1="225.9" x2="540" y2="225.9" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="229.9" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">4.0%</text><line x1="64" y1="189.0" x2="540" y2="189.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="193.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">4.5%</text><line x1="64" y1="152.1" x2="540" y2="152.1" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="156.1" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">5.0%</text><line x1="64" y1="115.2" x2="540" y2="115.2" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="119.2" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">5.5%</text><line x1="64" y1="78.3" x2="540" y2="78.3" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="82.3" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">6.0%</text><line x1="64" y1="34" x2="64" y2="248" style="stroke:#c9a99c;stroke-width:1.5;fill:none"/><line x1="64" y1="248" x2="540" y2="248" style="stroke:#c9a99c;stroke-width:1.5;fill:none"/><path d="M64.0,189.0 L111.6,185.3 L159.2,181.6 L206.8,172.7 L254.4,159.4 L302.0,143.2 L349.6,122.6 L397.2,100.4 L444.8,78.3 L492.4,63.5 L540.0,56.1" style="fill:none;stroke:#b83a10;stroke-width:2.6"/><path d="M64.0,225.9 L111.6,224.4 L159.2,222.2 L206.8,220.0 L254.4,217.0 L302.0,214.1 L349.6,211.1 L397.2,208.2 L444.8,205.2 L492.4,202.2 L540.0,200.0" style="fill:none;stroke:#e8551a;stroke-width:2.6"/><line x1="540.0" y1="56.1" x2="540.0" y2="200.0" style="stroke:#9a2f0e;stroke-width:1.4;stroke-dasharray:3 3"/><text x="532.0" y="128.1" text-anchor="end" style="fill:#9a2f0e;font:700 12px sans-serif">spread giãn ↑</text><circle cx="82" cy="40" r="4" style="fill:#b83a10"/><text x="91" y="44" style="fill:#9a4020;font:500 12px sans-serif">VNIBOR</text><circle cx="184" cy="40" r="4" style="fill:#e8551a"/><text x="193" y="44" style="fill:#9a4020;font:500 12px sans-serif">Lãi suất TPCP</text><text x="302.0" y="276" text-anchor="middle" style="fill:#9a4020;font:600 13px sans-serif">Thời gian →</text></svg>',
chartCap:'Hai lãi suất lẽ ra biến động cùng chiều, nhưng chênh lệch (spread) giữa chúng giãn dần — đó là <b>basis risk</b>.',
ex:'MSB dùng hợp đồng gắn <b>VNIBOR</b> để phòng ngừa một danh mục <b>TPCP</b>. Khi spread VNIBOR–TPCP giãn từ 0,5% lên 1,4%, vị thế phòng ngừa không còn khớp → phát sinh lỗ dù cả hai lãi suất đều cùng xu hướng tăng.',
arrow:'hai thứ đáng lẽ chạy cùng nhau lại lệch nhau (khác chỉ số / kỳ hạn / đồng tiền / công cụ), khiến hedge không khớp hoặc danh mục lỗ.'},

{n:'6',t:'Rủi ro đường cong (curve risk)',paras:[
P(0,'6. Rủi ro đường cong (curve risk): là rủi ro phát sinh từ sự thay đổi hình dạng, độ dốc hoặc cấu trúc kỳ hạn của các đường cong thị trường liên quan, bao gồm đường cong lãi suất, đường cong chênh lệch tín dụng hoặc các đường cong định giá/yếu tố rủi ro khác, dẫn đến biến động bất lợi đối với giá trị công cụ, giao dịch hoặc danh mục.')],
chart:'<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg"><line x1="64" y1="214.0" x2="540" y2="214.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="218.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">3.5%</text><line x1="64" y1="180.0" x2="540" y2="180.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="184.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">4.0%</text><line x1="64" y1="146.0" x2="540" y2="146.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="150.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">4.5%</text><line x1="64" y1="112.0" x2="540" y2="112.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="116.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">5.0%</text><line x1="64" y1="78.0" x2="540" y2="78.0" style="stroke:#f0dcd3;stroke-width:1;fill:none"/><text x="56" y="82.0" text-anchor="end" style="fill:#9a4020;font:500 12px sans-serif">5.5%</text><line x1="64" y1="44" x2="64" y2="248" style="stroke:#c9a99c;stroke-width:1.5;fill:none"/><line x1="64" y1="248" x2="540" y2="248" style="stroke:#c9a99c;stroke-width:1.5;fill:none"/><path d="M64.0,234.4 L143.3,200.4 L222.7,173.2 L302.0,152.8 L381.3,118.8 L460.7,91.6 L540.0,64.4" style="fill:none;stroke:#276749;stroke-width:2.6"/><path d="M64.0,234.4 L143.3,210.6 L222.7,193.6 L302.0,183.4 L381.3,169.8 L460.7,163.0 L540.0,159.6" style="fill:none;stroke:#b83a10;stroke-width:2.9"/><circle cx="64.0" cy="234.4" r="4" style="fill:#276749"/><text x="70.0" y="250.4" style="fill:#9a4020;font:500 12px sans-serif">điểm xoay</text><line x1="540.0" y1="64.4" x2="540.0" y2="159.6" style="stroke:#9a2f0e;stroke-width:1.4;stroke-dasharray:3 3"/><text x="534.0" y="112.0" text-anchor="end" style="fill:#9a2f0e;font:700 12px sans-serif">đầu dài</text><text x="534.0" y="126.0" text-anchor="end" style="fill:#9a2f0e;font:700 12px sans-serif">tụt xuống</text><text x="64.0" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">3M</text><text x="143.3" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">1Y</text><text x="222.7" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">2Y</text><text x="302.0" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">3Y</text><text x="381.3" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">5Y</text><text x="460.7" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">7Y</text><text x="540.0" y="266" text-anchor="middle" style="fill:#9a4020;font:500 12px sans-serif">10Y</text><line x1="64" y1="14" x2="84" y2="14" style="fill:none;stroke:#276749;stroke-width:2.6"/><text x="89" y="18" style="fill:#9a4020;font:500 12px sans-serif">Đường cong gốc (dốc lên)</text><line x1="294" y1="14" x2="314" y2="14" style="fill:none;stroke:#b83a10;stroke-width:2.9"/><text x="319" y="18" style="fill:#9a4020;font:500 12px sans-serif">Bẹt đi (flattening)</text><text x="302.0" y="280" text-anchor="middle" style="fill:#9a4020;font:600 13px sans-serif">Kỳ hạn →</text></svg>',
chartCap:'Đường cong đang <b>dốc lên</b> bị <b>bẹt đi</b> (flattening): đầu ngắn giữ nguyên, đầu dài tụt xuống — mức trung bình gần như không đổi nhưng <b>hình dạng</b> đổi. Đó là curve risk.',
ex:'Danh mục TPCP của MSB tập trung kỳ hạn dài (7Y–10Y). Khi đường cong <b>bẹt đi</b> — đầu ngắn giữ nguyên nhưng đầu dài tụt ~1% — chênh lệch lợi suất dài/ngắn thu hẹp, ảnh hưởng trực tiếp giá trị danh mục kỳ hạn dài dù mức lãi suất trung bình gần như không đổi.',
arrow:'rủi ro khi bản thân <b>hình dạng đường cong</b> đổi (dốc lên / bẹt / xoắn), không phải toàn bộ lãi suất dịch song song.'},

{n:'7',t:'Rủi ro delta',paras:[
P(0,'7. Rủi ro delta: là rủi ro phát sinh do giá trị công cụ, giao dịch hoặc danh mục thay đổi khi yếu tố rủi ro thị trường cơ sở thay đổi, phản ánh tác động tuyến tính/bậc một của yếu tố rủi ro.')],
ex:'MSB giữ trạng thái <b>long 1 triệu USD</b>. Tỷ giá USD/VND tăng 100đ → lãi ~100 triệu VND; giảm 100đ → lỗ tương ứng. Delta ở đây ≈ 1 triệu USD.',
arrow:'độ nhạy bậc một — yếu tố cơ sở nhích 1 đơn vị thì giá trị đổi tuyến tính bấy nhiêu.'},

{n:'8',t:'Rủi ro vega',paras:[
P(0,'8. Rủi ro vega: là rủi ro phát sinh do giá trị công cụ, giao dịch hoặc danh mục thay đổi khi độ biến động hàm ý (Implied volatility) của yếu tố rủi ro thị trường thay đổi.')],
note:{tag:'Lưu ý thuật ngữ',html:'<b>Độ biến động hàm ý</b> = mức dao động thị trường đang <b>ngầm định</b>, suy ngược từ giá quyền chọn đang giao dịch (nhìn về tương lai) — khác với biến động lịch sử tính từ giá quá khứ. Giá cơ sở đứng yên nhưng thị trường kỳ vọng sắp dao động mạnh hơn → implied vol tăng → quyền chọn đắt lên → phát sinh lỗ/lãi vega, độc lập với delta.'},
ex:'MSB <b>bán</b> một quyền chọn USD/VND. Thị trường căng thẳng, implied vol nhảy từ <b>3% lên 6%</b> dù tỷ giá giao ngay không đổi → quyền chọn được định giá lại cao hơn → MSB (đang short vega) ghi nhận lỗ.',
arrow:'độ nhạy với <b>kỳ vọng biến động</b> của thị trường (chủ yếu ở quyền chọn), không phải với bản thân giá cơ sở.'},

{n:'9',t:'Rủi ro curvature',paras:[
P(0,'9. Rủi ro curvature: là rủi ro phát sinh do giá trị công cụ thay đổi phi tuyến khi yếu tố rủi ro thị trường cơ sở biến động (tức phần rủi ro không được phản ánh đầy đủ bởi delta).')],
ex:'Với một quyền chọn, khi USD/VND biến động nhỏ, Delta ước tính khá đúng. Nhưng khi tỷ giá biến động mạnh, lãi/lỗ thực tế lớn hơn ước tính tuyến tính — phần chênh là curvature (tương ứng gamma).',
arrow:'độ cong bậc hai — phần delta bỏ sót khi biến động lớn (tương ứng gamma trong bộ Greeks).'},

{n:'10',t:'Yếu tố rủi ro thị trường',paras:[
P(0,'10. Yếu tố rủi ro thị trường là các biến số thị trường có thể ảnh hưởng đến giá trị công cụ, giao dịch hoặc danh mục, bao gồm nhưng không giới hạn lãi suất, đường cong lãi suất, tỷ giá, giá vàng, giá chứng khoán, giá hàng hóa, chênh lệch tín dụng, chênh lệch cơ sở, độ biến động, tương quan và các yếu tố thị trường khác phù hợp với sản phẩm, danh mục và phương pháp đo lường được áp dụng.')]},

{n:'11',t:'Sổ kinh doanh',paras:[
P(0,'11. Sổ kinh doanh là danh mục ghi nhận các trạng thái của:'),
P(1,'a) Giao dịch tự doanh;'),
P(1,'b) Giao dịch để thực hiện nghiệp vụ bảo lãnh phát hành công cụ tài chính;'),
P(1,'c) Giao dịch sản phẩm phái sinh để phòng ngừa rủi ro của các giao dịch tự doanh của MSB;'),
P(1,'d) Giao dịch mua bán ngoại tệ, vàng, tài sản tài chính để phục vụ nhu cầu của khách hàng, đối tác và các giao dịch để đối ứng với các giao dịch này.')],
arrow:'nơi ghi <b>4 nhóm trạng thái</b>: tự doanh · bảo lãnh phát hành · hedge cho tự doanh · phục vụ khách hàng + đối ứng. (Tiêu chí phân loại chi tiết ở Điều 9.)'},

{n:'12',t:'Giao dịch tự doanh',paras:[
P(0,'12. Giao dịch tự doanh: Là giao dịch mua, bán, trao đổi do MSB, công ty con của MSB thực hiện theo quy định của Pháp luật với mục đích mua, bán, trao đổi trong thời hạn không quá 01 năm để thu lợi từ chênh lệch giá trị thị trường cho MSB đối với các công cụ tài chính, bao gồm:'),
P(1,'a) Các công cụ tài chính trên thị trường tiền tệ;'),
P(1,'b) Các loại tiền tệ (bao gồm cả vàng);'),
P(1,'c) Chứng khoán trên thị trường vốn;'),
P(1,'d) Các sản phẩm phái sinh;'),
P(1,'e) Các công cụ tài chính khác được giao dịch trên thị trường chính thức.')],
arrow:'mua bán ngắn hạn (≤1 năm) ăn chênh giá thị trường, trên <b>5 nhóm công cụ</b>.'},

P(0,'13. Công cụ tài chính: Là hợp đồng làm tăng tài sản tài chính của một bên và nợ phải trả tài chính hoặc công cụ vốn chủ sở hữu của bên khác. Trong đó, công cụ vốn chủ sở hữu là hợp đồng chứng minh được những lợi ích còn lại về tài sản của đơn vị sau khi trừ đi toàn bộ nghĩa vụ của đơn vị đó.')],
arrow:'hợp đồng tạo tài sản tài chính bên này ↔ nợ tài chính / vốn chủ bên kia (theo chuẩn mực kế toán).'},

{n:'14',t:'Trạng thái rủi ro',paras:[
P(0,'14. Trạng thái rủi ro: Là mức độ rủi ro thị trường của MSB tại một thời điểm thể hiện thông qua giá trị rủi ro thị trường sau khi đã được quy đổi theo rủi ro của tài sản có rủi ro, nợ phải trả có rủi ro, khoản mục ngoại bảng có rủi ro thị trường.')],

P(0,'16. ES (Expected Shortfall): là thước đo tổn thất kỳ vọng trung bình của danh mục trong các trường hợp tổn thất vượt quá mức VaR tại một mức độ tin cậy xác định.')],

{n:'17',t:'Vi phạm hạn mức',paras:[
P(0,'17. Vi phạm hạn mức: Là trường hợp giá trị của một chỉ tiêu quản lý rủi ro thị trường nằm ngoài giới hạn do NHNN và/hoặc MSB quy định.')],
arrow:'chỉ tiêu vượt ngưỡng của NHNN và/hoặc MSB.'},

{n:'18',t:'Trường hợp ngoại lệ',paras:[
P(0,'18. Trường hợp ngoại lệ: là trường hợp vi phạm hạn mức được cấp có thẩm quyền chấp thuận theo quy định của pháp luật và quy định nội bộ của MSB.')],
arrow:'vi phạm hạn mức nhưng đã được cấp thẩm quyền phê duyệt.'},

{n:'19',t:'Ma trận rủi ro toàn diện',paras:[
P(0,'19. Ma trận rủi ro toàn diện: Là bảng ma trận mô tả chi tiết những rủi ro trọng yếu mà MSB đang phải đối mặt trong các giao dịch, hoạt động kinh doanh.')],
arrow:'bảng liệt kê chi tiết các rủi ro trọng yếu.'},

{n:'20',t:'Kiểm tra sức chịu đựng (stress-test)',paras:[
P(0,'20. Kiểm tra sức chịu đựng (stress-test): Là công cụ quản lý rủi ro mang tính dự báo để đánh giá tác động tiềm ẩn của biến động, thay đổi bất lợi, qua đó xác định khả năng chịu đựng rủi ro của MSB.')],
arrow:'công cụ dự báo, đo sức chịu đựng trước kịch bản bất lợi.'},

{n:'21',t:'Đơn vị tự doanh (Trading Desks)',paras:[
P(0,'21. Đơn vị tự doanh (Trading Desks) là các đơn vị, bộ phận thuộc Ngân hàng Định chế tài chính được MSB giao thực hiện hoạt động kinh doanh, giao dịch tự doanh, tạo lập thị trường, giao dịch đối ứng hoặc các hoạt động kinh doanh sản phẩm tài chính khác làm phát sinh rủi ro thị trường theo quy định nội bộ của MSB trong từng thời kỳ.')],
arrow:'các desk thuộc NH ĐCTC được giao hoạt động tự doanh / tạo lập / đối ứng phát sinh RRTT.'},

{n:'22',t:'Đơn vị kinh doanh (ĐVKD)',paras:[
P(0,'22. Đơn vị kinh doanh (ĐVKD): Là các trung tâm kinh doanh hoặc phòng, bộ phận kinh doanh tại các NHCD.')],
arrow:'đơn vị kinh doanh tại các NHCD.'},

{n:'23',t:'Cấp có thẩm quyền',paras:[
P(0,'23. Cấp có thẩm quyền bao gồm: Hội đồng Quản trị (HĐQT), Tổng Giám đốc (TGĐ) và các cấp được phân cấp, ủy quyền theo quy định nội bộ của MSB trong từng thời kỳ.')],
arrow:'HĐQT · TGĐ · các cấp được ủy quyền.'},

{n:'24',t:'NHNN',paras:[P(0,'24. NHNN: Ngân hàng Nhà nước Việt Nam.')]},
{n:'25',t:'MSB',paras:[P(0,'25. MSB: Ngân hàng TMCP Hàng hải Việt Nam.')]},
{n:'26',t:'HĐQT',paras:[P(0,'26. HĐQT: Hội đồng Quản trị.')]},
{n:'27',t:'TGĐ',paras:[P(0,'27. TGĐ: Tổng Giám đốc.')]},
{n:'28',t:'QLRRTT',paras:[P(0,'28. QLRRTT: Quản lý Rủi ro thị trường.')]},

{n:'29',t:'Bộ phận QLRRTT',paras:[
P(0,'29. Bộ phận QLRRTT: là bộ phận QLRRTT thuộc Chức năng Quản lý rủi ro thị trường – Phòng Quản lý Rủi ro thị trường và thanh khoản, Khối Quản lý rủi ro (K.QLRR).')]},
{n:'30',t:'Phòng QTDL&MHRR',paras:[
P(0,'30. Phòng QTDL&MHRR: Phòng Quản trị cơ sở dữ liệu và mô hình rủi ro – Trung tâm Phát triển mô hình công cụ & quản trị cơ sở dữ liệu rủi ro – Khối QLRR')]},
{n:'31',t:'TT.TT&PCRT',paras:[
P(0,'31. TT.TT&PCRT: Trung tâm Tuân thủ và Phòng chống rửa tiền – Khối Quản lý rủi ro.')]}
];

   P(1,'b) Các khoản mục thuộc Sổ ngân hàng được nắm giữ chủ yếu phục vụ hoạt động ngân hàng truyền thống, quản trị bảng cân đối, quản trị thanh khoản và rủi ro thanh khoản, đầu tư nắm giữ hoặc phòng ngừa rủi ro cho các khoản mục thuộc Sổ ngân hàng.')],
  defs:[['11','Sổ kinh doanh'],['12','Giao dịch tự doanh']],

 {n:'3',t:'Kiểm soát việc chuyển đổi giữa hai sổ',paras:[
   P(0,'3. Ngân hàng kiểm soát chặt chẽ và hạn chế việc chuyển đổi các khoản mục giữa Sổ kinh doanh và Sổ ngân hàng nhằm tránh việc làm sai lệch trạng thái rủi ro, kết quả kinh doanh hoặc yêu cầu vốn/rủi ro của Ngân hàng.'),
   P(0,'Việc chuyển đổi từ Sổ kinh doanh sang Sổ ngân hàng chỉ được thực hiện trong các trường hợp thực sự cần thiết, có cơ sở hợp lý, phản ánh bản chất rủi ro, khoản mục đó không còn đáp ứng được điều kiện, tiêu chí thuộc Sổ kinh doanh theo quy định, được đánh giá đầy đủ tác động rủi ro, yêu cầu về vốn và phê duyệt theo thẩm quyền quy định nội bộ của MSB phù hợp với quy định của pháp luật trong từng thời kỳ.')],
  defs:[['14','Trạng thái rủi ro'],['23','Cấp có thẩm quyền'],['11','Sổ kinh doanh']],
  arrow:'chuyển đổi bị <b>hạn chế</b>; chiều KD→NH chỉ khi thực sự cần thiết, có cơ sở, không còn đạt tiêu chí Sổ KD, <b>đã đánh giá tác động rủi ro & vốn</b> và được phê duyệt đúng thẩm quyền.',
  gap:{status:'N',
   reason:'Không coi là GAP nhưng theo dõi thêm. Trước đây chỉ suy đoán qua theo dõi rằng ĐVKD chuyển sổ qua bên thứ ba, không được ĐVKD xác nhận và không có bằng chứng chứng minh. Việc siết chặt bằng văn bản có thể hạn chế các nhu cầu điều chuyển hợp lý (mục đích nội bộ, thanh khoản ngân hàng...); pháp luật Việt Nam cũng không yêu cầu chặt chẽ tới mức này, nên không tự đặt ràng buộc vượt yêu cầu NHNN.'}},

 {n:'4',t:'Cấm chuyển từ Sổ ngân hàng sang Sổ kinh doanh',paras:[

 {n:'5',t:'TGĐ ban hành quy định chi tiết',paras:[

   P(1,'e) Cơ chế kiểm soát độc lập của bộ phận quản lý rủi ro đối với việc phân loại, duy trì và rà soát định kỳ ranh giới giữa hai Sổ;'),
